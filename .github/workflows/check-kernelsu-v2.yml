name: Check RMX1821 KernelSU v2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip jq file gzip binutils

      - name: Download latest Magisk
        run: |
          mkdir -p magisk

          curl -L --fail \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            -o magisk-release.json

          APK_URL=$(jq -r '
            .assets[]
            | select(.name | endswith(".apk"))
            | .browser_download_url
          ' magisk-release.json | head -n 1)

          test -n "$APK_URL"
          test "$APK_URL" != "null"

          curl -L --fail \
            "$APK_URL" \
            -o magisk.apk

          unzip -j magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk

          mv magisk/libmagiskboot.so magisk/magiskboot
          chmod +x magisk/magiskboot

      - name: Download KernelSU v2 boot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input

          ARTIFACT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.name == "RMX1821-KernelSU-Boot-v2")
              | select(.expired == false)
              | .id' \
            | head -n 1)

          test -n "$ARTIFACT_ID"

          echo "Artifact ID: $ARTIFACT_ID"

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            >