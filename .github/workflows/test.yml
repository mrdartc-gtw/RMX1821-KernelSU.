name: Build RMX1821 KernelSU v0.9.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev make unzip wget xz-utils zip device-tree-compiler file gzip python3 python3-pip perl rsync
          python3 --version
          make --version

      - name: Clone kernel source
        run: |
          set -eux
          git clone --depth=1 -b Q https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git kernel
          cd kernel
          git log -1 --oneline

      - name: Clone toolchains
        run: |
          set -eux
          mkdir -p toolchains

          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git toolchains/clang

          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchains/gcc64

          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchains/gcc32

          test -x toolchains/clang/bin/clang
          test -x toolchains/gcc64/bin/aarch64-linux-android-gcc
          test -x toolchains/gcc32/bin/arm-linux-androideabi-gcc

      - name: Integrate KernelSU v0.9.5
        run: |
          set -eux
          cd kernel

          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh | bash -s -- v0.9.5

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU v0.9.5 integration OK"

      - name: Prepare DrvGen
        run: |
          set -eux
          cd kernel

          test -f tools/dct/DrvGen.py

          echo "===== DRVGEN ====="
          file tools/dct/DrvGen.py
          head -n 10 tools/dct/DrvGen.py || true

          echo "===== PYTHON ====="
          python3 --version

          mv tools/dct/DrvGen.py tools/dct/DrvGen.py.real

          cat > tools/dct/DrvGen.py <<'EOF'
#!/bin/sh
exec python3 "$(dirname "$0")/DrvGen.py.real" "$@"
EOF

          chmod +x tools/dct/DrvGen.py

          echo "===== DRVGEN LAUNCHER ====="
          cat tools/dct/DrvGen.py
          file tools/dct/DrvGen.py

      - name: Configure kernel
        run: |
          set -eux
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          make O=out RMX1821_defconfig

          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KPROBES
          ./scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS

          make O=out olddefconfig

          echo "===== KERNELSU CONFIG ====="
          grep -E '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS)=' out/.config

          test "$(grep '^CONFIG_KSU=' out/.config)" = "CONFIG_KSU=y"
          test "$(grep '^CONFIG_KPROBES=' out/.config)" = "CONFIG_KPROBES=y"
          test "$(grep '^CONFIG_KPROBE_EVENTS=' out/.config)" = "CONFIG_KPROBE_EVENTS=y"

      - name: Build kernel
        run: |
          set -eux
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC="$GITHUB_WORKSPACE/toolchains/clang/bin/clang"

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "CC=$CC"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            Image.gz-dtb

          test -f out/arch/arm64/boot/Image.gz
          test -f out/arch/arm64/boot/Image.gz-dtb

          ls -lah out/arch/arm64/boot/

          sha256sum \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.gz-dtb

      - name: Download original boot
        run: |
          set -eux
          mkdir -p original

          wget -O original/boot.img "https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img"

          test -f original/boot.img
          ls -lah original/boot.img
          file original/boot.img
          sha256sum original/boot.img

      - name: Build magiskboot
        run: |
          set -eux

          git clone --depth=1 --recurse-submodules https://github.com/topjohnwu/Magisk.git magisk-source

          cd magisk-source

          git submodule update --init --recursive

          test -f native/src/external/cxx-rs/Cargo.toml

          python3 build.py ndk
          python3 build.py native magiskboot

          mkdir -p "$GITHUB_WORKSPACE/magiskboot-bin"

          find . -type f -name magiskboot -exec sh -c '
            if file "$1" | grep -q "ELF 64-bit.*x86-64"; then
              cp "$1" "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot"
              exit 0
            fi
          ' _ {} \;

          test -f "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot"

          chmod +x "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot"

          file "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot"

      - name: Unpack original boot
        run: |
          set -eux

          mkdir -p unpack
          cd unpack

          "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot" unpack "$GITHUB_WORKSPACE/original/boot.img"

          ls -lah

      - name: Prepare repack
        run: |
          set -eux

          test -f unpack/kernel
          test -f unpack/kernel_dtb
          test -f kernel/out/arch/arm64/boot/Image.gz

          mkdir -p repack

          cp unpack/kernel_dtb repack/original-kernel_dtb
          cp kernel/out/arch/arm64/boot/Image.gz repack/kernel.gz

          ls -lah repack

      - name: Replace kernel
        run: |
          set -eux

          cp repack/kernel.gz unpack/kernel
          cp repack/original-kernel_dtb unpack/kernel_dtb

          file unpack/kernel
          file unpack/kernel_dtb

          sha256sum unpack/kernel

      - name: Repack boot
        run: |
          set -eux

          cd unpack

          "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot" repack "$GITHUB_WORKSPACE/original/boot.img"

          test -f new-boot.img

          cp new-boot.img "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

          ls -lah "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

          file "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

          sha256sum "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

      - name: Verify boot
        run: |
          set -eux

          mkdir -p verify
          cd verify

          "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot" unpack "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

          ls -lah

          file kernel
          file kernel_dtb

          echo "===== KERNELSU STRINGS ====="

          strings kernel | grep -i -E 'kernelsu|ksud|/data/adb/ksud' | head -30 || true

      - name: Prepare artifacts
        run: |
          set -eux

          cp kernel/out/.config kernel.config
          cp kernel/out/arch/arm64/boot/Image.gz Image.gz
          cp kernel/out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb

          ls -lah \
            RMX1821-KernelSU-v0.9.5-test.img \
            Image.gz \
            Image.gz-dtb \
            kernel.config

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v0.9.5
          path: |
            RMX1821-KernelSU-v0.9.5-test.img
            Image.gz
            Image.gz-dtb
            kernel.config

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernelsu-v0.9.5-${{ github.run_number }}
          name: RMX1821 KernelSU v0.9.5 Build ${{ github.run_number }}
          files: |
            RMX1821-KernelSU-v0.9.5-test.img
            Image.gz
            Image.gz-dtb
            kernel.config
          generate_release_notes: true