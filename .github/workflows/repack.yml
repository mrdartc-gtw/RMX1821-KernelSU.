name: Build and Repack RMX1821 KernelSU v4

on:
  workflow_dispatch:

jobs:
  build-and-repack:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python2 \
            python2-minimal \
            python3 \
            zip \
            unzip \
            wget \
            file \
            rsync \
            clang \
            cmake \
            ninja-build

          echo "===== Python 2 ====="
          which python2
          python2 --version

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          echo "===== Python ====="
          which python
          python --version

          echo "===== Python 3 ====="
          which python3
          python3 --version


      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone RMX1821 kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel


      # ============================================================
      # 4. FIX DRVGEN.PY
      # ============================================================
      - name: Fix DrvGen interpreter
        working-directory: kernel
        run: |
          set -eux

          echo "===== DrvGen location ====="

          ls -l tools/dct/DrvGen.py

          echo "===== Original shebang ====="

          head -n 1 tools/dct/DrvGen.py || true

          # Remove CRLF
          sed -i 's/\r$//' tools/dct/DrvGen.py

          # Force Python 2
          sed -i '1c\#!/usr/bin/env python2' tools/dct/DrvGen.py

          chmod +x tools/dct/DrvGen.py

          echo "===== New shebang ====="

          head -n 1 tools/dct/DrvGen.py

          echo "===== Python 2 ====="

          which python2
          python2 --version

          echo "===== Python 2 test ====="

          python2 -c 'print("Python 2 OK")'

          echo "===== DrvGen test ====="

          python2 tools/dct/DrvGen.py || true


      # ============================================================
      # 5. DOWNLOAD CLANG r437112
      # ============================================================
      - name: Download Clang r437112
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git \
            clang


      # ============================================================
      # 6. DOWNLOAD ARM64 GCC 4.9
      # ============================================================
      - name: Download ARM64 GCC 4.9
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64


      # ============================================================
      # 7. DOWNLOAD ARM32 GCC 4.9
      # ============================================================
      - name: Download ARM32 GCC 4.9
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32


      # ============================================================
      # 8. INTEGRATE KERNELSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -eux

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh \
            | bash -


      # ============================================================
      # 9. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "===== Toolchain ====="

          clang --version

          aarch64-linux-android-gcc --version

          arm-linux-androideabi-gcc --version

          echo "===== Defconfig ====="

          make O=out RMX1821_defconfig

          echo "===== Enable KernelSU ====="

          ./scripts/config --file out/.config \
            -e CONFIG_KSU

          echo "===== Olddefconfig ====="

          make O=out olddefconfig

          echo "===== KernelSU config ====="

          grep -E '^CONFIG_KSU=' out/.config || true


      # ============================================================
      # 10. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "===== Build ====="

          make -j"$(nproc)" \
            O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image.gz-dtb


      # ============================================================
      # 11. VERIFY KERNEL OUTPUT
      # ============================================================
      - name: Verify kernel output
        working-directory: kernel
        run: |
          set -eux

          echo "===== Boot directory ====="

          ls -lh out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "===== Kernel SHA256 ====="

          sha256sum out/arch/arm64/boot/Image.gz-dtb

          echo "===== Kernel size ====="

          stat -c%s out/arch/arm64/boot/Image.gz-dtb


      # ============================================================
      # 12. UPLOAD KERNEL ARTIFACT
      # ============================================================
      - name: Upload KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v4
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error


      # ============================================================
      # 13. BUILD OFFICIAL MAGISKBOOT
      # ============================================================
      - name: Build MagiskBoot
        run: |
          set -eux

          echo "===== Clone official Magisk ====="

          git clone \
            --depth=1 \
            https://github.com/topjohnwu/Magisk.git \
            magisk-source

          cd magisk-source

          echo "===== Magisk source ====="

          git rev-parse HEAD

          echo "===== Build.py ====="

          python3 build.py --help

          echo "===== Prepare Magisk NDK ====="

          python3 build.py ndk

          echo "===== Build magiskboot ====="

          python3 build.py native magiskboot

          echo "===== Search magiskboot ====="

          find . \
            -type f \
            -name magiskboot \
            -print

          MAGISKBOOT=$(find . \
            -type f \
            -name magiskboot \
            | head -n 1)

          test -n "$MAGISKBOOT"

          echo "===== Found ====="

          echo "$MAGISKBOOT"

          echo "===== File information ====="

          file "$MAGISKBOOT"

          ls -lh "$MAGISKBOOT"

          echo "===== Copy ====="

          cp "$MAGISKBOOT" "$GITHUB_WORKSPACE/magiskboot"

          chmod +x "$GITHUB_WORKSPACE/magiskboot"


      # ============================================================
      # 14. VERIFY MAGISKBOOT
      # ============================================================
      - name: Verify MagiskBoot
        run: |
          set -eux

          echo "===== MagiskBoot ====="

          test -f magiskboot

          chmod +x magiskboot

          file magiskboot

          ls -lh magiskboot

          echo "===== Help ====="

          ./magiskboot --help || true

          echo "===== Test ====="

          ./magiskboot version || true


      # ============================================================
      # 15. DOWNLOAD ORIGINAL BOOT
      # ============================================================
      - name: Download original boot
        run: |
          set -eux

          mkdir -p original

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            -O original/boot.img \
            https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img

          test -s original/boot.img

          echo "===== Original boot ====="

          ls -lh original/boot.img

          echo "===== SHA256 ====="

          sha256sum original/boot.img

          echo "===== Size ====="

          stat -c%s original/boot.img

          echo "===== File ====="

          file original/boot.img


      # ============================================================
      # 16. UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot
        run: |
          set -eux

          rm -rf unpack

          mkdir -p unpack

          cp original/boot.img unpack/boot.img

          cd unpack

          "$GITHUB_WORKSPACE/magiskboot" unpack boot.img

          echo "===== UNPACK RESULT ====="

          ls -lah

          echo "===== Boot files ====="

          for f in kernel kernel_dtb dtb ramdisk.cpio ramdisk.cpio.gz second extra recovery_dtbo; do

            if [ -f "$f" ]; then
              echo "FOUND: $f"
              file "$f"
              stat -c "%n %s bytes" "$f"
            else
              echo "NOT FOUND: $f"
            fi

          done


      # ============================================================
      # 17. PREPARE KERNEL
      # ============================================================
      - name: Prepare KernelSU kernel
        working-directory: kernel
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/repack"

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            "$GITHUB_WORKSPACE/repack/Image.gz-dtb"

          echo "===== New kernel ====="

          ls -lh "$GITHUB_WORKSPACE/repack/Image.gz-dtb"

          file "$GITHUB_WORKSPACE/repack/Image.gz-dtb"

          sha256sum "$GITHUB_WORKSPACE/repack/Image.gz-dtb"

          stat -c%s "$GITHUB_WORKSPACE/repack/Image.gz-dtb"


      # ============================================================
      # 18. DETECT BOOT STRUCTURE
      # ============================================================
      - name: Detect boot structure
        run: |
          set -eux

          echo "===== Original boot structure ====="

          if [ -f unpack/kernel ]; then
            echo "kernel: YES"
            file unpack/kernel
            stat -c%s unpack/kernel
          else
            echo "kernel: NO"
          fi

          if [ -f unpack/kernel_dtb ]; then
            echo "kernel_dtb: YES"
            file unpack/kernel_dtb
            stat -c%s unpack/kernel_dtb
          else
            echo "kernel_dtb: NO"
          fi

          if [ -f unpack/dtb ]; then
            echo "dtb: YES"
            file unpack/dtb
            stat -c%s unpack/dtb
          else
            echo "dtb: NO"
          fi

          echo "===== Header ====="

          if [ -f unpack/header ]; then
            cat unpack/header
          else
            echo "header file not generated"
          fi


      # ============================================================
      # 19. PREPARE NEW KERNEL / DTB
      # ============================================================
      - name: Prepare kernel replacement
        run: |
          set -eux

          IMAGE="$GITHUB_WORKSPACE/repack/Image.gz-dtb"

          echo "===== New Image.gz-dtb ====="

          file "$IMAGE"

          stat -c%s "$IMAGE"

          echo "===== Check appended DTB ====="

          python3 - "$IMAGE" <<'PY'
          import sys
          import struct

          path = sys.argv[1]

          with open(path, "rb") as f:
              data = f.read()

          magic = b"\xd0\x0d\xfe\xed"

          print("Image size:", len(data))

          found = []

          pos = 0

          while True:
              pos = data.find(magic, pos)

              if pos == -1:
                  break

              if pos + 8 <= len(data):

                  totalsize = struct.unpack(
                      ">I",
                      data[pos + 4:pos + 8]
                  )[0]

                  if totalsize > 0 and