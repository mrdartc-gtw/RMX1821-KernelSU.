name: Build and Repack RMX1821 KernelSU v5

on:
  workflow_dispatch:

jobs:
  build-and-repack:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python2 \
            python2-minimal \
            python3 \
            zip \
            unzip \
            wget \
            file \
            rsync \
            clang \
            cmake \
            ninja-build \
            binutils

          echo "===== Python 2 ====="
          which python2
          python2 --version

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          echo "===== Python ====="
          which python
          python --version

          echo "===== Python 3 ====="
          which python3
          python3 --version


      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone RMX1821 kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel


      # ============================================================
      # 4. FIX DRVGEN.PY
      # ============================================================
      - name: Fix DrvGen interpreter
        working-directory: kernel
        run: |
          set -eux

          echo "===== DrvGen location ====="

          ls -l tools/dct/DrvGen.py

          echo "===== Original shebang ====="

          head -n 1 tools/dct/DrvGen.py || true

          sed -i 's/\r$//' tools/dct/DrvGen.py

          sed -i '1c\#!/usr/bin/env python2' tools/dct/DrvGen.py

          chmod +x tools/dct/DrvGen.py

          echo "===== New shebang ====="

          head -n 1 tools/dct/DrvGen.py

          echo "===== Python 2 ====="

          which python2
          python2 --version

          echo "===== Python 2 test ====="

          python2 -c 'print("Python 2 OK")'

          echo "===== DrvGen test ====="

          python2 tools/dct/DrvGen.py || true


      # ============================================================
      # 5. DOWNLOAD CLANG r437112
      # ============================================================
      - name: Download Clang r437112
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git \
            clang


      # ============================================================
      # 6. DOWNLOAD ARM64 GCC 4.9
      # ============================================================
      - name: Download ARM64 GCC 4.9
        run: |
          set -eux

          echo "===== Download ARM64 GCC 4.9 ====="

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo "===== GCC64 ====="

          test -d gcc64
          ls -lah gcc64

          echo "===== GCC64 binaries ====="

          ls -lah gcc64/bin/

          echo "===== GCC version ====="

          gcc64/bin/aarch64-linux-android-gcc --version


      # ============================================================
      # 7. DOWNLOAD ARM32 GCC 4.9
      # ============================================================
      - name: Download ARM32 GCC 4.9
        run: |
          set -eux

          echo "===== Download ARM32 GCC 4.9 ====="

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          echo "===== GCC32 ====="

          test -d gcc32
          ls -lah gcc32

          echo "===== GCC32 binaries ====="

          ls -lah gcc32/bin/

          echo "===== GCC version ====="

          gcc32/bin/arm-linux-androideabi-gcc --version