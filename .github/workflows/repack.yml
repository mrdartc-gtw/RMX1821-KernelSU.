name: Repack RMX1821 KernelSU v2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            jq

      - name: Download original boot.img
        run: |
          mkdir -p original

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o original/boot.img \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/boot-original/boot.img"

          echo "===== Original boot ====="
          ls -lh original/boot.img
          file original/boot.img

      - name: Download KernelSU v2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kernel-artifact

          echo "===== Searching KernelSU v2 artifact ====="

          ARTIFACT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.name == "RMX1821-KernelSU-v2")
              | select(.expired == false)
              | .id' \
            | head -n 1)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "Artifact RMX1821-KernelSU-v2 tidak ditemukan."
            echo "===== Available artifacts ====="

            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | "\(.id) \(.name) \(.expired)"'

            exit 1
          fi

          echo "Artifact ID: $ARTIFACT_ID"

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > kernel-artifact.zip

          unzip -o kernel-artifact.zip \
            -d kernel-artifact

          echo "===== Downloaded artifact ====="
          find kernel-artifact -type f -ls