name: Repack RMX1821 KernelSU v3

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            jq \
            file \
            python3

      - name: Download original boot.img
        run: |
          mkdir -p original

          curl -L --fail \
            --retry 5 \
            --retry-delay 5 \
            -o original/boot.img \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/boot-original/boot.img"

          echo "===== Original boot ====="
          ls -lh original/boot.img
          file original/boot.img

      - name: Download KernelSU v2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kernel-artifact

          ARTIFACT_ID=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.name == "RMX1821-KernelSU-v2")
              | select(.expired == false)
              | .id' \
            | head -n 1)

          if [ -z "$ARTIFACT_ID" ]; then
            echo "KernelSU v2 artifact tidak ditemukan."
            echo "===== Available artifacts ====="

            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] |
                "\(.id) \(.name) expired=\(.expired)"'

            exit 1
          fi

          echo "Artifact ID: $ARTIFACT_ID"

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > kernel-artifact.zip

          unzip -o kernel-artifact.zip \
            -d kernel-artifact

          echo "===== Artifact contents ====="
          find kernel-artifact -type f -ls

      - name: Prepare Image.gz-dtb
        run: |
          IMAGE=$(find kernel-artifact \
            -type f \
            -name "Image.gz-dtb" \
            | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "Image.gz-dtb tidak ditemukan."
            exit 1
          fi

          cp "$IMAGE" Image.gz-dtb

          echo "===== KernelSU kernel ====="
          ls -lh Image.gz-dtb
          file Image.gz-dtb

      - name: Download Magisk
        run: |
          mkdir -p magisk

          curl -L --fail \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            -o magisk-release.json

          APK_URL=$(jq -r '
            .assets[]
            | select(.name | endswith(".apk"))
            | .browser_download_url
          ' magisk-release.json | head -n 1)

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Magisk APK tidak ditemukan."
            exit 1
          fi

          curl -L --fail \
            "$APK_URL" \
            -o magisk.apk

          unzip -j magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk

          mv magisk/libmagiskboot.so magisk/magiskboot
          chmod +x magisk/magiskboot

      - name: Unpack original boot
        run: |
          mkdir -p unpack

          cp original/boot.img unpack/boot.img

          cd unpack

          ../magisk/magiskboot unpack boot.img

          echo "===== Original boot contents ====="
          ls -lah

      - name: Inspect original boot components
        run: |
          echo "===== Original kernel ====="
          file unpack/kernel
          stat -c "%s bytes" unpack/kernel

          echo "===== Original DTB ====="

          if [ -f unpack/dtb ]; then
            file unpack/dtb
            stat -c "%s bytes" unpack/dtb
          else
            echo "No separate dtb file"
          fi

          echo "===== Original ramdisk ====="

          if [ -f unpack/ramdisk.cpio ]; then
            file unpack/ramdisk.cpio
            stat -c "%s bytes" unpack/ramdisk.cpio
          fi

      - name: Replace kernel
        run: |
          test -f unpack/kernel
          test -f Image.gz-dtb

          echo "===== Replacing kernel ====="

          cp Image.gz-dtb unpack/kernel

          echo "===== New kernel ====="
          file unpack/kernel
          stat -c "%s bytes" unpack/kernel

      - name: Repack boot
        run: |
          cd unpack

          ../magisk/magiskboot repack \
            boot.img \
            ../boot-kernelsu-v3.img

          cd ..

          test -s boot-kernelsu-v3.img

          echo "===== Final boot ====="
          ls -lh boot-kernelsu-v3.img
          file boot-kernelsu-v3.img
          sha256sum boot-kernelsu-v3.img

      - name: Verify final boot
        run: |
          rm -rf verify
          mkdir -p verify

          cp boot-kernelsu-v3.img verify/boot.img

          cd verify

          ../magisk/magiskboot unpack boot.img

          echo "===== Verification ====="
          ls -lah

          echo "===== Kernel ====="
          file kernel
          stat -c "%s bytes" kernel

          echo "===== Ramdisk ====="

          if [ -f ramdisk.cpio ]; then
            file ramdisk.cpio
            stat -c "%s bytes" ramdisk.cpio
          fi

          echo "===== DTB ====="

          if [ -f dtb ]; then
            file dtb
            stat -c "%s bytes" dtb
          fi

      - name: Compare DTB
        run: |
          if [ -f unpack/dtb ] && [ -f verify/dtb ]; then
            echo "===== DTB comparison ====="
            cmp unpack/dtb verify/dtb
            echo "DTB tidak berubah."
          else
            echo "Tidak ada DTB terpisah untuk dibandingkan."
          fi

      - name: Upload KernelSU v3 boot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-Boot-v3
          path: boot-kernelsu-v3.img
          if-no-files-found: error
          retention-days: 7