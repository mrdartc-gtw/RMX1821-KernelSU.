name: Build and Repack RMX1821 KernelSU v4

on:
  workflow_dispatch:

jobs:
  build-and-repack:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python2 \
            python2-minimal \
            zip \
            unzip \
            wget

          echo "===== Python ====="
          which python2 || true
          python2 --version

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          which python
          python --version

      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone RMX1821 kernel source
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

      # ============================================================
      # 4. FIX DRVGEN.PY
      # ============================================================
      - name: Fix DrvGen interpreter
        working-directory: kernel
        run: |
          set -eux

          echo "===== DrvGen location ====="
          ls -l tools/dct/DrvGen.py

          echo "===== Original shebang ====="
          head -n 1 tools/dct/DrvGen.py || true

          # Remove CRLF if present
          sed -i 's/\r$//' tools/dct/DrvGen.py

          # Force Python 2 interpreter
          sed -i '1c\#!/usr/bin/env python2' tools/dct/DrvGen.py

          chmod +x tools/dct/DrvGen.py

          echo "===== New shebang ====="
          head -n 1 tools/dct/DrvGen.py

          echo "===== Python ====="
          which python2
          python2 --version
          python --version

          echo "===== Python 2 test ====="
          python2 -c 'print("Python 2 OK")'

          echo "===== DrvGen test ====="
          python2 tools/dct/DrvGen.py || true

      # ============================================================
      # 5. DOWNLOAD CLANG
      # ============================================================
      - name: Download Clang r437112
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git \
            clang

      # ============================================================
      # 6. DOWNLOAD ARM64 GCC
      # ============================================================
      - name: Download ARM64 GCC 4.9
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64

      # ============================================================
      # 7. DOWNLOAD ARM32 GCC
      # ============================================================
      - name: Download ARM32 GCC 4.9
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      # ============================================================
      # 8. INTEGRATE KERNELSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -eux

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh \
            | bash -

      # ============================================================
      # 9. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "===== Toolchain ====="
          clang --version
          aarch64-linux-android-gcc --version
          arm-linux-androideabi-gcc --version

          echo "===== Defconfig ====="
          make O=out RMX1821_defconfig

          echo "===== Enable KernelSU ====="
          ./scripts/config --file out/.config \
            -e CONFIG_KSU

          echo "===== Olddefconfig ====="
          make O=out olddefconfig

          echo "===== KernelSU config ====="
          grep -E '^CONFIG_KSU=' out/.config || true

      # ============================================================
      # 10. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          echo "===== Build ====="

          make -j"$(nproc)" \
            O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image.gz-dtb

      # ============================================================
      # 11. VERIFY KERNEL OUTPUT
      # ============================================================
      - name: Verify kernel output
        working-directory: kernel
        run: |
          set -eux

          ls -lh out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "===== Kernel SHA256 ====="
          sha256sum out/arch/arm64/boot/Image.gz-dtb

          echo "===== Kernel size ====="
          stat -c%s out/arch/arm64/boot/Image.gz-dtb

      # ============================================================
      # 12. UPLOAD KERNEL ARTIFACT
      # ============================================================
      - name: Upload KernelSU kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v4
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error

      # ============================================================
      # 13. DOWNLOAD MAGISKBOOT
      # ============================================================
      - name: Download Magisk tools
        run: |
          set -eux

          rm -rf magisk
          mkdir -p magisk

          MAGISK_VERSION="v30.7"

          echo "===== Download Magisk APK ====="

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            -O magisk.apk \
            "https://github.com/topjohnwu/Magisk/releases/download/${MAGISK_VERSION}/Magisk-${MAGISK_VERSION}.apk"

          test -s magisk.apk

          echo "===== Verify APK ====="
          file magisk.apk
          ls -lh magisk.apk
          sha256sum magisk.apk

          echo "===== APK contents ====="

          unzip -l magisk.apk > magisk-apk-list.txt

          grep -Ei 'magiskboot|boot' magisk-apk-list.txt || true

          echo "===== Extract APK ====="

          unzip -q magisk.apk -d magisk/apk

          echo "===== Search for MagiskBoot ====="

          find magisk/apk -type f \
            \( -iname '*magiskboot*' -o -iname '*boot*' \) \
            -print || true

          echo "===== Complete extracted file list ====="

          find magisk/apk -type f | sort > magisk-files.txt

          cat magisk-files.txt

          echo "===== Search standalone magiskboot ====="

echo "===== Search for MagiskBoot ====="

find magisk/apk -type f \
  \( -iname '*magiskboot*' -o -iname '*boot*' \) \
  -print || true

echo "===== Complete extracted file list ====="

find magisk/apk -type f | sort > magisk-files.txt

cat magisk-files.txt

echo "===== Search possible Magisk binaries ====="

find magisk/apk -type f -exec file {} \; \
  | grep -Ei 'ELF|executable|shared object' \
  || true

echo "===== Search magiskboot ====="

MAGISKBOOT=$(find magisk/apk \
  -type f \
  \( -name 'magiskboot' -o -name '*magiskboot*' \) \
  | head -n 1 || true)

if [ -n "$MAGISKBOOT" ]; then
  echo "Found possible MagiskBoot:"
  echo "$MAGISKBOOT"

  file "$MAGISKBOOT"

  cp "$MAGISKBOOT" ./magiskboot
  chmod +x ./magiskboot

  echo "===== Test magiskboot ====="

  file ./magiskboot
  ./magiskboot --help || true

else
  echo "ERROR: MagiskBoot binary was not found."
  echo
  echo "===== APK FILE LIST ====="
  cat magisk-files.txt
  echo
  echo "===== ELF FILES ====="

  find magisk/apk -type f -exec file {} \; \
    | grep -Ei 'ELF|executable|shared object' \
    || true

  exit 1
fi 

      # ============================================================
      # 14. DOWNLOAD ORIGINAL BOOT FROM RELEASE
      # ============================================================
      - name: Download original boot
        run: |
          set -eux

          mkdir -p original

          wget -O original/boot.img \
            https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img

          ls -lh original/boot.img

          echo "===== Original boot SHA256 ====="
          sha256sum original/boot.img

          echo "===== Original boot size ====="
          stat -c%s original/boot.img

      # ============================================================
      # 15. UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot
        run: |
          set -eux

          rm -rf unpack
          mkdir -p unpack

          cp original/boot.img unpack/boot.img

          cd unpack

          ../magiskboot unpack boot.img

          echo "===== UNPACK RESULT ====="
          ls -lah

          echo "===== Boot files ====="

          for f in kernel dtb ramdisk.cpio ramdisk.cpio.gz; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
              file "$f"
              stat -c "%n %s bytes" "$f"
            else
              echo "NOT FOUND: $f"
            fi
          done

      # ============================================================
      # 16. PREPARE NEW KERNEL / DTB
      # ============================================================
      - name: Prepare KernelSU kernel
        working-directory: kernel
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/repack"

          cp out/arch/arm64/boot/Image.gz-dtb \
            "$GITHUB_WORKSPACE/repack/Image.gz-dtb"

          echo "===== New Image.gz-dtb ====="
          ls -lh "$GITHUB_WORKSPACE/repack/Image.gz-dtb"

          sha256sum "$GITHUB_WORKSPACE/repack/Image.gz-dtb"

      # ============================================================
      # 17. DETECT AND SPLIT APPENDED DTB
      # ============================================================
      - name: Prepare kernel and DTB
        run: |
          set -eux

          IMAGE="$GITHUB_WORKSPACE/repack/Image.gz-dtb"

          echo "===== Original boot DTB status ====="

          if [ -f unpack/dtb ]; then
            echo "Original boot has separate DTB."
            echo "SEPARATE_DTB=1" >> "$GITHUB_ENV"

            cp unpack/dtb repack/original-dtb

            echo "===== Original DTB ====="
            file repack/original-dtb
            stat -c "%n %s bytes" repack/original-dtb

            echo "===== Searching appended DTB ====="

            python3 - "$IMAGE" <<'PY'
          import sys
          import struct

          path = sys.argv[1]

          with open(path, "rb") as f:
              data = f.read()

          magic = b"\xd0\x0d\xfe\xed"

          positions = []
          pos = 0

          while True:
              pos = data.find(magic, pos)

              if pos == -1:
                  break

              if pos + 8 <= len(data):
                  totalsize = struct.unpack(">I", data[pos + 4:pos + 8])[0]

                  if totalsize > 0 and pos + totalsize == len(data):
                      positions.append((pos, totalsize))

              pos += 4

          if not positions:
              print("ERROR: No valid appended DTB found.")
              sys.exit(1)

          pos, totalsize = positions[-1]

          print("DTB offset :", pos)
          print("DTB size   :", totalsize)
          print("File size  :", len(data))

          with open("repack/kernel.gz", "wb") as f:
              f.write(data[:pos])

          with open("repack/dtb", "wb") as f:
              f.write(data[pos:])

          print("kernel.gz written")
          print("dtb written")
          PY

            echo "===== Split result ====="

            ls -lh repack/kernel.gz
            ls -lh repack/dtb

            echo "===== Validate DTB ====="

            python3 - <<'PY'
          import struct

          path = "repack/dtb"

          with open(path, "rb") as f:
              data = f.read()

          assert data[:4] == b"\xd0\x0d\xfe\xed"

          size = struct.unpack(">I", data[4:8])[0]

          print("DTB header size:", size)
          print("DTB file size  :", len(data))

          assert size == len(data)

          print("DTB OK")
          PY

          else
            echo "Original boot does NOT have separate DTB."
            echo "SEPARATE_DTB=0" >> "$GITHUB_ENV"

            cp "$IMAGE" repack/kernel
          fi

      # ============================================================
      # 18. REPLACE KERNEL / DTB
      # ============================================================
      - name: Replace kernel files
        run: |
          set -eux

          if [ "$SEPARATE_DTB" = "1" ]; then
            echo "Replacing kernel and DTB separately."

            cp repack/kernel.gz unpack/kernel
            cp repack/dtb unpack/dtb

          else
            echo "Replacing kernel directly."

            cp repack/Image.gz-dtb unpack/kernel
          fi

          echo "===== Final kernel ====="
          file unpack/kernel
          stat -c "%n %s bytes" unpack/kernel

          if [ -f unpack/dtb ]; then
            echo "===== Final DTB ====="
            file unpack/dtb
            stat -c "%n %s bytes" unpack/dtb
          fi

      # ============================================================
      # 19. REPACK BOOT
      # ============================================================
      - name: Repack boot image
        run: |
          set -eux

          cd unpack

          ../magiskboot repack boot.img

          test -f new-boot.img

          cp new-boot.img "$GITHUB_WORKSPACE/boot-kernelsu-v4.img"

      # ============================================================
      # 20. VERIFY REPACKED BOOT
      # ============================================================
      - name: Verify repacked boot
        run: |
          set -eux

          echo "===== Final boot ====="

          ls -lh boot-kernelsu-v4.img

          file boot-kernelsu-v4.img

          echo "===== Final boot SHA256 ====="

          sha256sum boot-kernelsu-v4.img

          echo "===== Final boot size ====="

          stat -c%s boot-kernelsu-v4.img

          rm -rf verify

          mkdir -p verify

          cp boot-kernelsu-v4.img verify/boot.img

          cd verify

          ../magiskboot unpack boot.img

          echo "===== FINAL UNPACK ====="

          ls -lah

          echo "===== FINAL KERNEL ====="

          if [ -f kernel ]; then
            file kernel
            stat -c "%n %s bytes" kernel
          else
            echo "ERROR: kernel missing"
            exit 1
          fi

          if [ -f dtb ]; then
            echo "===== FINAL DTB ====="
            file dtb
            stat -c "%n %s bytes" dtb
          fi

      # ============================================================
      # 21. UPLOAD FINAL BOOT
      # ============================================================
      - name: Upload KernelSU boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-kernelsu-v4
          path: boot-kernelsu-v4.img
          if-no-files-found: error

      # ============================================================
      # 22. UPLOAD DEBUG FILES
      # ============================================================
      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v4-debug
          path: |
            repack/Image.gz-dtb
            repack/kernel.gz
            repack/dtb
            unpack/kernel
            unpack/dtb
            boot-kernelsu-v4.img
          if-no-files-found: ignore