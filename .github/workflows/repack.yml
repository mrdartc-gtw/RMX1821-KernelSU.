name: Build RMX1821 KernelSU v0.9.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            python3-pip \
            unzip \
            wget \
            xz-utils \
            zip \
            device-tree-compiler

      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone kernel source
        run: |
          set -eux

          git clone --depth=1 \
            -b Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

          cd kernel

          git rev-parse HEAD

      # ============================================================
      # 4. DOWNLOAD CLANG
      # ============================================================
      - name: Clone Clang r437112
        run: |
          set -eux

          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git \
            clang

          test -x clang/bin/clang
          clang/bin/clang --version

      # ============================================================
      # 5. DOWNLOAD GCC ARM64
      # ============================================================
      - name: Clone GCC arm64 4.9
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

      # ============================================================
      # 6. DOWNLOAD GCC ARM32
      # ============================================================
      - name: Clone GCC arm32 4.9
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          test -x gcc32/bin/arm-linux-androideabi-gcc

      # ============================================================
      # 7. INTEGRATE KERNELSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -eux

          echo "============================================================"
          echo "INTEGRATE KERNELSU v0.9.5"
          echo "============================================================"

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh \
            | bash -s -- v0.9.5

          test -d KernelSU

          echo "===== KernelSU version ====="
          git -C KernelSU describe --tags --exact-match

          test "$(git -C KernelSU describe --tags --exact-match)" = "v0.9.5"

          echo "===== KernelSU integration ====="

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU v0.9.5 successfully integrated."

      # ============================================================
      # 8. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          set -eux

          echo "============================================================"
          echo "CONFIGURE KERNEL"
          echo "============================================================"

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          make O=out RMX1821_defconfig

          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KPROBES
          ./scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS

          make O=out olddefconfig

          echo "===== KernelSU configuration ====="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_HAVE_KPROBES)=' \
            out/.config || true

          test "$(grep '^CONFIG_KSU=' out/.config)" = "CONFIG_KSU=y"
          test "$(grep '^CONFIG_KPROBES=' out/.config)" = "CONFIG_KPROBES=y"
          test "$(grep '^CONFIG_KPROBE_EVENTS=' out/.config)" = "CONFIG_KPROBE_EVENTS=y"

          echo "KernelSU configuration OK."

# ============================================================
      # 9. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          echo "============================================================"
          echo "BUILD KERNEL"
          echo "============================================================"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$GITHUB_WORKSPACE/clang/bin/clang"

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          echo "===== TOOLCHAIN ====="

          "$GITHUB_WORKSPACE/clang/bin/clang" --version

          "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc" --version | head -1

          echo "===== BUILD ====="

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            Image.gz-dtb

          echo "============================================================"
          echo "BUILD COMPLETED"
          echo "============================================================"

          test -f out/arch/arm64/boot/Image.gz-dtb

          ls -lh out/arch/arm64/boot/Image.gz-dtb

          file out/arch/arm64/boot/Image.gz-dtb

          sha256sum out/arch/arm64/boot/Image.gz-dtb

      # ============================================================
      # 10. VERIFY KERNELSU IN BUILT KERNEL
      # ============================================================
      - name: Verify KernelSU in kernel
        working-directory: kernel
        run: |
          set -eux

          echo "============================================================"
          echo "VERIFY KERNELSU"
          echo "============================================================"

          grep -aob "KernelSU" \
            out/arch/arm64/boot/Image.gz-dtb \
            | head -20 || true

          grep -aob "/data/adb/ksud" \
            out/arch/arm64/boot/Image.gz-dtb \
            | head -20 || true

          echo "KernelSU verification completed."

      # ============================================================
      # 11. DOWNLOAD ORIGINAL BOOT
      # ============================================================
      - name: Download original boot.img
        run: |
          set -eux

          mkdir -p unpack

          wget -O unpack/boot.img \
            https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img

          test -f unpack/boot.img

          ls -lh unpack/boot.img

          sha256sum unpack/boot.img

          stat -c%s unpack/boot.img

      # ============================================================
      # 12. BUILD MAGISKBOOT
      # ============================================================
      - name: Build magiskboot
        run: |
          set -eux

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/topjohnwu/Magisk.git \
            magisk-source

          cd magisk-source

          git submodule update --init --recursive

          test -f native/src/external/cxx-rs/Cargo.toml

          python3 build.py ndk
          python3 build.py native magiskboot

          echo "===== Find magiskboot ====="

          find . -type f -name magiskboot -exec file {} \;

          MAGISKBOOT="$(find . -type f -name magiskboot \
            -exec file {} \; | \
            grep 'ELF 64-bit.*x86-64' | \
            head -1 | \
            cut -d: -f1)"

          test -n "$MAGISKBOOT"

          cp "$MAGISKBOOT" "$GITHUB_WORKSPACE/magiskboot"

          chmod +x "$GITHUB_WORKSPACE/magiskboot"

          file "$GITHUB_WORKSPACE/magiskboot"

      # ============================================================
      # 13. UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot
        run: |
          set -eux

          cd unpack

          "$GITHUB_WORKSPACE/magiskboot" unpack boot.img

          echo "===== Unpacked files ====="

          ls -lah

          test -f kernel
          test -f kernel_dtb
          test -f ramdisk.cpio

          echo "===== Original kernel ====="

          file kernel
          ls -lh kernel
          sha256sum kernel

          echo "===== Original DTB ====="

          file kernel_dtb
          ls -lh kernel_dtb
          sha256sum kernel_dtb

      # ============================================================
      # 14. PREPARE NEW KERNEL
      #
      # IMPORTANT:
      # We keep the ORIGINAL DTB.
      # Only replace the gzip kernel.
      # ============================================================
      - name: Replace kernel while preserving original DTB
        working-directory: kernel
        run: |
          set -eux

          echo "============================================================"
          echo "PREPARE NEW KERNEL"
          echo "============================================================"

          rm -rf "$GITHUB_WORKSPACE/newkernel"
          mkdir -p "$GITHUB_WORKSPACE/newkernel"

          cd "$GITHUB_WORKSPACE/newkernel"

          cp "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz" kernel.gz

          test -f kernel.gz

          echo "===== New kernel gzip ====="

          file kernel.gz
          ls -lh kernel.gz
          sha256sum kernel.gz

          echo "===== Gzip test ====="

          gzip -t kernel.gz

          echo "New kernel gzip is valid."

      # ============================================================
      # 15. REPLACE ONLY KERNEL
      # ============================================================
      - name: Install new kernel into boot tree
        run: |
          set -eux

          echo "============================================================"
          echo "INSTALL NEW KERNEL"
          echo "============================================================"

          cp newkernel/kernel.gz unpack/kernel

          echo "===== Kernel after replacement ====="

          file unpack/kernel
          ls -lh unpack/kernel
          sha256sum unpack/kernel

          echo "===== DTB remains original ====="

          file unpack/kernel_dtb
          ls -lh unpack/kernel_dtb
          sha256sum unpack/kernel_dtb

      # ============================================================
      # 16. REPACK BOOT
      # ============================================================
      - name: Repack boot.img
        run: |
          set -eux

          cd unpack

          "$GITHUB_WORKSPACE/magiskboot" repack boot.img

          echo "============================================================"
          echo "REPACK RESULT"
          echo "============================================================"

          ls -lah

          test -f new-boot.img

          file new-boot.img

          ls -lh new-boot.img

          sha256sum new-boot.img

          stat -c%s new-boot.img

      # ============================================================
      # 17. VERIFY BOOT IMAGE
      # ============================================================
      - name: Verify new boot image
        run: |
          set -eux

          cd unpack

          echo "============================================================"
          echo "VERIFY NEW BOOT IMAGE"
          echo "============================================================"

          "$GITHUB_WORKSPACE/magiskboot" unpack new-boot.img

          echo "===== New boot contents ====="

          ls -lah

          test -f kernel
          test -f kernel_dtb
          test -f ramdisk.cpio

          echo "===== New boot kernel ====="

          file kernel
          ls -lh kernel

          echo "===== New boot DTB ====="

          file kernel_dtb
          ls -lh kernel_dtb

          echo "===== Repack verification successful ====="

      # ============================================================
      # 18. COPY FINAL FILE
      # ============================================================
      - name: Prepare artifact
        run: |
          set -eux

          mkdir -p release

          cp unpack/new-boot.img \
            release/RMX1821-KernelSU-v0.9.5-test.img

          cp kernel/out/arch/arm64/boot/Image.gz-dtb \
            release/Image.gz-dtb

          sha256sum release/*

          ls -lh release

      # ============================================================
      # 19. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v0.9.5-test
          path: release/
          if-no-files-found: error