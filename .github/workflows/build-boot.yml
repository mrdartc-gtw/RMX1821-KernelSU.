name: Build RMX1821 KernelSU Full

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

          echo "===== DEPENDENCIES ====="

          git --version
          python3 --version
          docker --version

      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone RMX1821 kernel source
        run: |
          set -e

          echo "===== CLONE COSMICFRESH ====="

          git clone \
            --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

          echo "===== VERIFY SOURCE ====="

          test -f kernel/Makefile
          test -d kernel/arch
          test -d kernel/drivers
          test -d kernel/include

          echo "Kernel source OK."

          cd kernel

          git log -1 --oneline

      # ============================================================
      # 4. INSTALL CLANG r437112b
      # ============================================================
      - name: Install Clang r437112b
        run: |
          set -e

          echo "===== DOWNLOAD CLANG ====="

          mkdir -p clang

          curl -L --fail --retry 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/98603376816dd5a1fbb960856438124d4c618158/clang-r437112b.tar.gz" \
            -o clang-r437112b.tar.gz

          test -s clang-r437112b.tar.gz

          echo "===== EXTRACT CLANG ====="

          tar -xzf clang-r437112b.tar.gz -C clang

          rm -f clang-r437112b.tar.gz

          test -x clang/bin/clang

          chmod +x clang/bin/clang

          echo "===== CLANG VERSION ====="

          ./clang/bin/clang --version

      # ============================================================
      # 5. GCC 4.9 AARCH64
      # ============================================================
      - name: Install GCC 4.9 AArch64
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          gcc64/bin/aarch64-linux-android-gcc --version

      # ============================================================
      # 6. GCC 4.9 ARM32
      # ============================================================
      - name: Install GCC 4.9 ARM32
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          test -x gcc32/bin/arm-linux-androideabi-gcc

          gcc32/bin/arm-linux-androideabi-gcc --version

      # ============================================================
      # 7. TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: Configure toolchain
        run: |
          set -e

          echo "ARCH=arm64" >> "$GITHUB_ENV"

          echo "CC=${{ github.workspace }}/clang/bin/clang" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=${{ github.workspace }}/gcc64/bin/aarch64-linux-android-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE_ARM32=${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

      # ============================================================
      # 8. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify toolchain
        run: |
          set -e

          export CC="${{ github.workspace }}/clang/bin/clang"
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== CLANG ====="

          test -x "$CC"
          "$CC" --version

          echo "===== GCC64 ====="

          test -x "${CROSS_COMPILE}gcc"
          "${CROSS_COMPILE}gcc" --version

          echo "===== GCC32 ====="

          test -x "${CROSS_COMPILE_ARM32}gcc"
          "${CROSS_COMPILE_ARM32}gcc" --version

      # ============================================================
      # 9. CPU TARGET
      # ============================================================
      - name: Fix CPU target
        working-directory: kernel
        run: |
          set -e

          echo "===== CPU TARGET ====="

          sed -i \
            's/-mcpu=cortex-a73\.cortex-a53/-mcpu=cortex-a53/g' \
            Makefile

          sed -i \
            's/-mtune=cortex-a73\.cortex-a53/-mtune=cortex-a53/g' \
            Makefile

          grep -n \
            -E 'mcpu=|mtune=' \
            Makefile | head -30

      # ============================================================
      # 10. KERNELSU
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e

          echo "===== KERNELSU ====="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash -s -- v0.9.5

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU integration OK."

      # ============================================================
      # 11. FIND DEFCONFIG
      # ============================================================
      - name: Find defconfig
        working-directory: kernel
        run: |
          set -e

          echo "===== AVAILABLE DEFCONFIG ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo "===== SEARCH RMX / OPPO / MT6771 ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*rmx*' -o \
              -iname '*oppo*' -o \
              -iname '*6771*' -o \
              -iname '*mtk*' \
            \) \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 12. SELECT DEFCONFIG
      # ============================================================
      - name: Select defconfig
        working-directory: kernel
        run: |
          set -e

          CONFIG=""

          for candidate in \
            rmx1821_defconfig \
            RMX1821_defconfig \
            oppo6771_18601_defconfig \
            mt6771_defconfig \
            oppo6771_defconfig
          do
            if [ -f "arch/arm64/configs/$candidate" ]; then
              CONFIG="$candidate"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: defconfig RMX1821 tidak ditemukan."
            echo
            echo "Available configs:"
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            exit 1
          fi

          echo "Selected: $CONFIG"

          echo "RMX_DEFCONFIG=$CONFIG" >> "$GITHUB_ENV"

      # ============================================================
      # 13. BASE CONFIG
      # ============================================================
      - name: Create base config
        working-directory: kernel
        run: |
          set -e

          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== CREATE CONFIG ====="

          rm -rf out

          mkdir -p out

          make \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            "$RMX_DEFCONFIG"

          test -f out/.config

          echo "Base config created."

      # ============================================================
      # 14. KERNEL CONFIG
      # ============================================================
      - name: Configure KernelSU
        working-directory: kernel
        run: |
          set -e

          scripts/config \
            --file out/.config \
            -e CONFIG_KPROBES \
            -e CONFIG_KSU \
            --set-val LITTLE_CPU_MASK 15 \
            --set-val BIG_CPU_MASK 240 \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR

          echo "===== CONFIG ====="

          grep -E \
            'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_LITTLE_CPU_MASK=|CONFIG_BIG_CPU_MASK=' \
            out/.config || true

      # ============================================================
      # 15. sched_boost PATCH
      # ============================================================
      - name: Fix sched_boost
        working-directory: kernel
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/sched.h")
          s = p.read_text()

          old1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);"""

          new1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif"""

          if old1 in s:
              s = s.replace(old1, new1, 1)

          old2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          new2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          if old2 in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s)

          print("sched_boost patch OK")
          PY

      # ============================================================
      # 16. stack_trace PATCH
      # ============================================================
      - name: Fix stack_trace
        working-directory: kernel
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/netdevice.h")
          s = p.read_text()

          if "#include <linux/stacktrace.h>" not in s:

              if "#include <linux/stackdepot.h>" in s:
                  s = s.replace(
                      "#include <linux/stackdepot.h>",
                      "#include <linux/stackdepot.h>\n#include <linux/stacktrace.h>",
                      1
                  )

              elif "#include <linux/types.h>" in s:
                  s = s.replace(
                      "#include <linux/types.h>",
                      "#include <linux/types.h>\n#include <linux/stacktrace.h>",
                      1
                  )

              else:
                  raise SystemExit(
                      "Cannot find include location"
                  )

              p.write_text(s)

          print("stacktrace patch OK")
          PY

          grep -n "stacktrace.h" \
            include/linux/netdevice.h

      # ============================================================
      # 17. DRVGEN
      # ============================================================
      - name: Prepare DrvGen
        working-directory: kernel
        run: |
          set -e

          cd tools/dct

          test -f DrvGen.py

          if [ ! -f DrvGen.py.real ]; then
            cp DrvGen.py DrvGen.py.real
          fi

          cat > DrvGen.py <<'EOF'
          #!/bin/sh
          set -e

          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          KERNEL_DIR="$(CDPATH= cd -- "$SCRIPT_DIR/../.." && pwd)"

          DWS="$1"
          GEN="$2"
          LOG="$3"
          PARAM="$4"

          if [ -z "$DWS" ] || [ -z "$GEN" ] || [ -z "$LOG" ]; then
            echo "DrvGen wrapper: missing arguments"
            exit 1
          fi

          resolve_path() {
            TARGET="$1"

            case "$TARGET" in
              /*)
                printf '%s\n' "$TARGET"
                ;;
              *)
                printf '%s/%s\n' "$(pwd)" "$TARGET"
                ;;
            esac
          }

          DWS="$(resolve_path "$DWS")"
          GEN="$(resolve_path "$GEN")"
          LOG="$(resolve_path "$LOG")"

          case "$DWS" in
            "$KERNEL_DIR"/*)
              DWS="/workspace/${DWS#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$GEN" in
            "$KERNEL_DIR"/*)
              GEN="/workspace/${GEN#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$LOG" in
            "$KERNEL_DIR"/*)
              LOG="/workspace/${LOG#"$KERNEL_DIR"/}"
              ;;
          esac

          echo "[DrvGen wrapper] DWS=$DWS"
          echo "[DrvGen wrapper] GEN=$GEN"
          echo "[DrvGen wrapper] LOG=$LOG"

          exec docker run --rm \
            -v "$KERNEL_DIR:/workspace" \
            -w /workspace/tools/dct \
            python:2.7 \
            python2 DrvGen.py.real \
            "$DWS" \
            "$GEN" \
            "$LOG" \
            "$PARAM"
          EOF

          chmod +x DrvGen.py

          echo "DrvGen ready."

      # ============================================================
      # 18. OLDDEFCONFIG
      # ============================================================
      - name: Run olddefconfig
        working-directory: kernel
        run: |
          set -e

          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          test -f out/.config

          make \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            olddefconfig

          echo "olddefconfig OK."

      # ============================================================
      # 19. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== BUILD KERNEL ====="

          make \
            -j"$(nproc)" \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out

          echo "===== VERIFY IMAGE ====="

          test -f out/arch/arm64/boot/Image.gz-dtb

          stat \
            -c '%n = %s bytes' \
            out/arch/arm64/boot/Image.gz-dtb

      # ============================================================
      # 20. PREPARE BOOT WORKSPACE
      # ============================================================
      - name: Prepare boot workspace
        run: |
          set -e

          mkdir -p boot-work

          cp \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            boot-work/Image.gz-dtb

          test -s boot-work/Image.gz-dtb

          echo "Kernel copied."

      # ============================================================
      # 21. DOWNLOAD ORIGINAL BOOT
      # ============================================================
      - name: Download original boot
        run: |
          set -e

          curl -L --fail --retry 5 \
            "https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img" \
            -o boot-work/boot-original.img

          test -s boot-work/boot-original.img

          echo "===== ORIGINAL BOOT ====="

          stat \
            -c '%n = %s bytes' \
            boot-work/boot-original.img

      # ============================================================
      # 22. BUILD MAGISKBOOT
      # ============================================================
      - name: Download magiskboot Linux x86-64
        working-directory: boot-work
        run: |
          set -e

          # Download Magisk APK
          curl -L --fail --retry 3 \
            "https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk" \
            -o Magisk.apk

          # APK adalah ZIP
          unzip -o Magisk.apk "lib/x86_64/libmagiskboot.so" -d magisk-extract

          cp magisk-extract/lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

          echo "===== MAGISKBOOT ====="
          file magiskboot
          ls -lh magiskboot

          # Pastikan benar-benar executable
          ./magiskboot --help >/dev/null || true
      # ============================================================
      # 23. UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot
        working-directory: boot-work
        run: |
          set -e

          mkdir -p original

          cd original

          ../magiskboot unpack ../boot-original.img

          echo "===== ORIGINAL BOOT ====="

          ls -lh

      # ============================================================
      # 24. CHECK ORIGINAL BOOT
      # ============================================================
      - name: Check original boot structure
        working-directory: boot-work/original
        run: |
          set -e

          echo "===== HEADER ====="

          ../magiskboot unpack ../boot-original.img || true

          echo "===== FILES ====="

          ls -lh

          test -f kernel
          test -f kernel_dtb
          test -f ramdisk.cpio

          echo "Original boot structure OK."

      # ============================================================
      # 25. EXTRACT NEW KERNEL
      # ============================================================
      - name: Extract new kernel
        working-directory: boot-work
        run: |
          set -e

          DTB_SIZE="$(stat -c%s original/kernel_dtb)"

          IMAGE_SIZE="$(stat -c%s Image.gz-dtb)"

          echo "Image.gz-dtb: $IMAGE_SIZE bytes"
          echo "Original DTB: $DTB_SIZE bytes"

          if [ "$IMAGE_SIZE" -le "$DTB_SIZE" ]; then
            echo "ERROR: invalid Image.gz-dtb size"
            exit 1
          fi

          KERNEL_GZ_SIZE=$((IMAGE_SIZE - DTB_SIZE))

          echo "Kernel gzip: $KERNEL_GZ_SIZE bytes"

          dd \
            if=Image.gz-dtb \
            of=new-kernel.gz \
            bs=1 \
            count="$KERNEL_GZ_SIZE" \
            status=none

          gzip -t new-kernel.gz

          gzip -dc \
            new-kernel.gz \
            > new-kernel

          test -s new-kernel

          echo "===== NEW KERNEL ====="

          stat \
            -c '%n = %s bytes' \
            new-kernel

      # ============================================================
      # 26. REPLACE ONLY KERNEL
      # ============================================================
      - name: Replace kernel
        working-directory: boot-work
        run: |
          set -e

          echo "===== REPLACE ONLY KERNEL ====="

          cp \
            new-kernel \
            original/kernel

          test -f original/kernel
          test -f original/kernel_dtb
          test -f original/ramdisk.cpio

          echo "Kernel replaced."
          echo "DTB preserved."
          echo "Ramdisk preserved."

      # ============================================================
      # 27. REPACK BOOT
      # ============================================================
      - name: Repack boot
        working-directory: boot-work/original
        run: |
          set -e

          echo "===== REPACK ====="

          ../magiskboot repack \
            ../boot-original.img \
            ../boot-kernelsu.img

          test -s ../boot-kernelsu.img

          echo "===== RESULT ====="

          stat \
            -c '%n = %s bytes' \
            ../boot-kernelsu.img

      # ============================================================
      # 28. VERIFY REPACKED BOOT
      # ============================================================
      - name: Verify boot image
        working-directory: boot-work
        run: |
          set -e

          echo "===== VERIFY BOOT IMAGE ====="

          mkdir -p verify

          cd verify

          ../magiskboot unpack ../boot-kernelsu.img

          echo "===== FILES ====="

          ls -lh

          test -f kernel
          test -f kernel_dtb
          test -f ramdisk.cpio

      # ============================================================
      # 29. VERIFY DTB
      # ============================================================
      - name: Verify DTB unchanged
        working-directory: boot-work
        run: |
          set -e

          echo "===== DTB CHECK ====="

          sha256sum \
            original/kernel_dtb \
            verify/kernel_dtb

          cmp \
            original/kernel_dtb \
            verify/kernel_dtb

          echo "DTB unchanged: OK."

      # ============================================================
      # 30. VERIFY RAMDISK
      # ============================================================
      - name: Verify ramdisk unchanged
        working-directory: boot-work
        run: |
          set -e

          echo "===== RAMDISK CHECK ====="

          sha256sum \
            original/ramdisk.cpio \
            verify/ramdisk.cpio

          cmp \
            original/ramdisk.cpio \
            verify/ramdisk.cpio

          echo "Ramdisk unchanged: OK."

      # ============================================================
      # 31. VERIFY FINAL IMAGE
      # ============================================================
      - name: Verify final boot image
        working-directory: boot-work
        run: |
          set -e

          echo "===== FINAL BOOT ====="

          stat \
            -c '%n = %s bytes' \
            boot-kernelsu.img

          file boot-kernelsu.img

          echo "===== SHA256 ====="

          sha256sum \
            boot-original.img \
            boot-kernelsu.img \
            Image.gz-dtb

          sha256sum \
            boot-kernelsu.img \
            > boot-kernelsu.img.sha256

      # ============================================================
      # 32. UPLOAD FINAL ARTIFACT
      # ============================================================
      - name: Upload final KernelSU boot
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-Boot
          path: |
            boot-work/boot-kernelsu.img
            boot-work/boot-kernelsu.img.sha256
            boot-work/Image.gz-dtb
          if-no-files-found: error