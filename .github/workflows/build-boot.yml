name: Build RMX1821 KernelSU Full

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          echo "========================================"
          echo "INSTALL DEPENDENCIES"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cmake \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd \
            file \
            binutils \
            gzip \
            cpio

          echo
          echo "===== VERSIONS ====="

          git --version
          python3 --version
          cmake --version
          ninja --version
          docker --version
          file --version


      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone RMX1821 kernel source
        run: |
          set -e

          echo "========================================"
          echo "CLONE COSMICFRESH RMX1821"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

          echo
          echo "===== VERIFY SOURCE ====="

          test -f kernel/Makefile
          test -d kernel/arch
          test -d kernel/drivers
          test -d kernel/include

          cd kernel

          echo "Kernel commit:"
          git log -1 --oneline

          echo
          echo "Kernel source OK."


      # ============================================================
      # 4. INSTALL CLANG r437112b
      # ============================================================
      - name: Install Clang r437112b
        run: |
          set -e

          echo "========================================"
          echo "INSTALL CLANG r437112b"
          echo "========================================"

          mkdir -p clang

          curl -L --fail --retry 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/98603376816dd5a1fbb960856438124d4c618158/clang-r437112b.tar.gz" \
            -o clang-r437112b.tar.gz

          test -s clang-r437112b.tar.gz

          tar -xzf \
            clang-r437112b.tar.gz \
            -C clang

          rm -f clang-r437112b.tar.gz

          test -x clang/bin/clang

          chmod +x clang/bin/clang

          echo
          echo "===== CLANG VERSION ====="

          ./clang/bin/clang --version


      # ============================================================
      # 5. GCC 4.9 AARCH64
      # ============================================================
      - name: Install GCC 4.9 AArch64
        run: |
          set -e

          echo "========================================"
          echo "INSTALL GCC 4.9 AARCH64"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          gcc64/bin/aarch64-linux-android-gcc --version


      # ============================================================
      # 6. GCC 4.9 ARM32
      # ============================================================
      - name: Install GCC 4.9 ARM32
        run: |
          set -e

          echo "========================================"
          echo "INSTALL GCC 4.9 ARM32"
          echo "========================================"

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          test -x gcc32/bin/arm-linux-androideabi-gcc

          gcc32/bin/arm-linux-androideabi-gcc --version


      # ============================================================
      # 7. CONFIGURE TOOLCHAIN
      # ============================================================
      - name: Configure toolchain
        run: |
          set -e

          echo "ARCH=arm64" >> "$GITHUB_ENV"

          echo "CC=${{ github.workspace }}/clang/bin/clang" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=${{ github.workspace }}/gcc64/bin/aarch64-linux-android-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE_ARM32=${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"


      # ============================================================
      # 8. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify toolchain
        run: |
          set -e

          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== ARCH ====="

          echo "ARCH=arm64"

          echo
          echo "===== CLANG ====="

          test -x "$CC"
          "$CC" --version

          echo
          echo "===== GCC64 ====="

          test -x "${CROSS_COMPILE}gcc"
          "${CROSS_COMPILE}gcc" --version

          echo
          echo "===== GCC32 ====="

          test -x "${CROSS_COMPILE_ARM32}gcc"
          "${CROSS_COMPILE_ARM32}gcc" --version

          echo
          echo "Toolchain OK."


      # ============================================================
      # 9. FIX CPU TARGET
      # ============================================================
      - name: Fix CPU target
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "FIX CPU TARGET"
          echo "========================================"

          sed -i \
            's/-mcpu=cortex-a73\.cortex-a53/-mcpu=cortex-a53/g' \
            Makefile

          sed -i \
            's/-mtune=cortex-a73\.cortex-a53/-mtune=cortex-a53/g' \
            Makefile

          echo
          echo "===== CPU FLAGS ====="

          grep -n \
            -E 'mcpu=|mtune=' \
            Makefile | head -30 || true


      # ============================================================
      # 10. INTEGRATE KERNELSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "INTEGRATE KERNELSU v0.9.5"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash -s -- v0.9.5

          echo
          echo "===== VERIFY KERNELSU ====="

          test -d drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU integration OK."


      # ============================================================
      # 11. FIND DEFCONFIG
      # ============================================================
      - name: Find defconfig
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "AVAILABLE DEFCONFIG"
          echo "========================================"

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "===== RMX / OPPO / MT6771 ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*rmx*' -o \
              -iname '*oppo*' -o \
              -iname '*6771*' -o \
              -iname '*mtk*' \
            \) \
            -printf '%f\n' \
            | sort || true


      # ============================================================
      # 12. SELECT DEFCONFIG
      # ============================================================
      - name: Select defconfig
        working-directory: kernel
        run: |
          set -e

          CONFIG=""

          for candidate in \
            rmx1821_defconfig \
            RMX1821_defconfig \
            oppo6771_18601_defconfig \
            mt6771_defconfig \
            oppo6771_defconfig
          do
            if [ -f "arch/arm64/configs/$candidate" ]; then
              CONFIG="$candidate"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: RMX1821 defconfig tidak ditemukan."

            echo
            echo "===== AVAILABLE CONFIGS ====="

            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

            exit 1
          fi

          echo
          echo "Selected defconfig:"
          echo "$CONFIG"

          echo "RMX_DEFCONFIG=$CONFIG" >> "$GITHUB_ENV"


      # ============================================================
      # 13. CREATE BASE CONFIG
      # ============================================================
      - name: Create base config
        working-directory: kernel
        run: |
          set -e

          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "========================================"
          echo "CREATE BASE CONFIG"
          echo "========================================"

          rm -rf out

          mkdir -p out

          make \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            "$RMX_DEFCONFIG"

          test -f out/.config

          echo
          echo "Base config created."


      # ============================================================
      # 14. CONFIGURE KERNELSU
      # ============================================================
      - name: Configure KernelSU
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "CONFIGURE KERNELSU"
          echo "========================================"

          scripts/config \
            --file out/.config \
            -e CONFIG_KPROBES \
            -e CONFIG_KSU \
            --set-val LITTLE_CPU_MASK 15 \
            --set-val BIG_CPU_MASK 240 \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR

          echo
          echo "===== KERNELSU CONFIG ====="

          grep -E \
            'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_LITTLE_CPU_MASK=|CONFIG_BIG_CPU_MASK=|CONFIG_CC_STACKPROTECTOR_' \
            out/.config || true


      # ============================================================
      # 15. FIX sched_boost
      # ============================================================
      - name: Fix sched_boost
        working-directory: kernel
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/sched.h")
          s = p.read_text()

          old1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);"""

          new1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif"""

          if old1 in s:
              s = s.replace(old1, new1, 1)

          old2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          new2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          if old2 in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s)

          print("sched_boost patch OK")
          PY


      # ============================================================
      # 16. FIX stack_trace
      # ============================================================
      - name: Fix stack_trace
        working-directory: kernel
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/netdevice.h")
          s = p.read_text()

          if "#include <linux/stacktrace.h>" not in s:

              if "#include <linux/stackdepot.h>" in s:
                  s = s.replace(
                      "#include <linux/stackdepot.h>",
                      "#include <linux/stackdepot.h>\n#include <linux/stacktrace.h>",
                      1
                  )

              elif "#include <linux/types.h>" in s:
                  s = s.replace(
                      "#include <linux/types.h>",
                      "#include <linux/types.h>\n#include <linux/stacktrace.h>",
                      1
                  )

              else:
                  raise SystemExit(
                      "Cannot find include location"
                  )

              p.write_text(s)

          print("stacktrace patch OK")
          PY

          grep -n \
            "stacktrace.h" \
            include/linux/netdevice.h


      # ============================================================
      # 17. PREPARE DRVGEN
      # ============================================================
      - name: Prepare DrvGen
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "PREPARE DRVGEN"
          echo "========================================"

          cd tools/dct

          test -f DrvGen.py

          if [ ! -f DrvGen.py.real ]; then
            cp DrvGen.py DrvGen.py.real
          fi

          cat > DrvGen.py <<'EOF'
          #!/bin/sh
          set -e

          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          KERNEL_DIR="$(CDPATH= cd -- "$SCRIPT_DIR/../.." && pwd)"

          DWS="$1"
          GEN="$2"
          LOG="$3"
          PARAM="$4"

          if [ -z "$DWS" ] || [ -z "$GEN" ] || [ -z "$LOG" ]; then
            echo "DrvGen wrapper: missing arguments"
            exit 1
          fi

          resolve_path() {
            TARGET="$1"

            case "$TARGET" in
              /*)
                printf '%s\n' "$TARGET"
                ;;
              *)
                printf '%s/%s\n' "$(pwd)" "$TARGET"
                ;;
            esac
          }

          DWS="$(resolve_path "$DWS")"
          GEN="$(resolve_path "$GEN")"
          LOG="$(resolve_path "$LOG")"

          case "$DWS" in
            "$KERNEL_DIR"/*)
              DWS="/workspace/${DWS#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$GEN" in
            "$KERNEL_DIR"/*)
              GEN="/workspace/${GEN#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$LOG" in
            "$KERNEL_DIR"/*)
              LOG="/workspace/${LOG#"$KERNEL_DIR"/}"
              ;;
          esac

          echo "[DrvGen wrapper] DWS=$DWS"
          echo "[DrvGen wrapper] GEN=$GEN"
          echo "[DrvGen wrapper] LOG=$LOG"

          exec docker run --rm \
            -v "$KERNEL_DIR:/workspace" \
            -w /workspace/tools/dct \
            python:2.7 \
            python2 DrvGen.py.real \
            "$DWS" \
            "$GEN" \
            "$LOG" \
            "$PARAM"
          EOF

          chmod +x DrvGen.py

          echo "DrvGen ready."


      # ============================================================
      # 18. OLDDEFCONFIG
      # ============================================================
      - name: Run olddefconfig
        working-directory: kernel
        run: |
          set -e

          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          test -f out/.config

          make \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            olddefconfig

          echo "olddefconfig OK."


      # ============================================================
      # 19. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          make \
            -j"$(nproc)" \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out

          echo
          echo "===== VERIFY IMAGE ====="

          test -s out/arch/arm64/boot/Image.gz-dtb

          stat \
            -c '%n = %s bytes' \
            out/arch/arm64/boot/Image.gz-dtb

          file \
            out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "Kernel build OK."


      # ============================================================
      # 20. PREPARE BOOT WORKSPACE
      # ============================================================
      - name: Prepare boot workspace
        run: |
          set -e

          echo "========================================"
          echo "PREPARE BOOT WORKSPACE"
          echo "========================================"

          rm -rf boot-work

          mkdir -p boot-work

          cp \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            boot-work/Image.gz-dtb

          test -s boot-work/Image.gz-dtb

          echo "Image.gz-dtb copied."


      # ============================================================
      # 21. DOWNLOAD ORIGINAL BOOT
      # ============================================================
      - name: Download original boot
        run: |
          set -e

          echo "========================================"
          echo "DOWNLOAD ORIGINAL BOOT"
          echo "========================================"

          curl -L --fail --retry 5 \
            "https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img" \
            -o boot-work/boot-original.img

          test -s boot-work/boot-original.img

          echo
          echo "===== ORIGINAL BOOT ====="

          stat \
            -c '%n = %s bytes' \
            boot-work/boot-original.img

          file \
            boot-work/boot-original.img


      # ============================================================
      # 22. BUILD MAGISKBOOT HOST x86-64
      # ============================================================
      - name: Build host magiskboot x86-64
        run: |
          set -e

          echo "========================================"
          echo "BUILD MAGISKBOOT x86-64"
          echo "========================================"

          rm -rf magisk-source

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/topjohnwu/Magisk.git \
            magisk-source

          cd magisk-source

          git submodule update --init --recursive

          echo
          echo "===== MAGISK COMMIT ====="

          git log -1 --oneline

          echo
          echo "===== HOST ARCH ====="

          uname -m

          test "$(uname -m)" = "x86_64"

          echo
          echo "===== SETUP MAGISK NDK ====="

          python3 build.py ndk

          echo
          echo "===== BUILD MAGISKBOOT ====="

          python3 build.py -r native magiskboot

          echo
          echo "===== MAGISKBOOT FILES ====="

          find native/out \
            -type f \
            -name magiskboot \
            -exec file {} \;

          echo
          echo "===== SELECT x86_64 ====="

          HOST_MAGISKBOOT="native/out/x86_64/magiskboot"

          test -f "$HOST_MAGISKBOOT"

          chmod +x "$HOST_MAGISKBOOT"

          file "$HOST_MAGISKBOOT"

          if ! file "$HOST_MAGISKBOOT" | grep -q "x86-64"; then
            echo "ERROR: x86-64 magiskboot tidak valid."
            exit 1
          fi

          echo
          echo "===== TEST EXECUTION ====="

          "$HOST_MAGISKBOOT" --help >/dev/null 2>&1 || true

          echo
          echo "===== COPY ====="

          cp \
            "$HOST_MAGISKBOOT" \
            "${{ github.workspace }}/boot-work/magiskboot"

          chmod +x \
            "${{ github.workspace }}/boot-work/magiskboot"

          file \
            "${{ github.workspace }}/boot-work/magiskboot"

          echo
          echo "Magiskboot host OK."


      # ============================================================
      # 23. VERIFY MAGISKBOOT
      # ============================================================
      - name: Verify magiskboot
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "VERIFY MAGISKBOOT"
          echo "========================================"

          test -f magiskboot
          test -x magiskboot

          file magiskboot

          if ! file magiskboot | grep -q "x86-64"; then
            echo "ERROR: magiskboot bukan x86-64."
            exit 1
          fi

          echo
          echo "===== EXECUTION TEST ====="

          ./magiskboot --help >/dev/null 2>&1 || true

          echo
          echo "magiskboot OK."


      # ============================================================
      # 24. UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "UNPACK ORIGINAL BOOT"
          echo "========================================"

          rm -rf original

          mkdir -p original

          cd original

          ../magiskboot unpack ../boot-original.img

          echo
          echo "===== UNPACKED FILES ====="

          ls -lah

          test -f kernel
          test -f kernel_dtb
          test -f ramdisk.cpio

          echo
          echo "Original boot unpack OK."


      # ============================================================
      # 25. VERIFY ORIGINAL BOOT
      # ============================================================
      - name: Verify original boot structure
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "VERIFY ORIGINAL BOOT"
          echo "========================================"

          test -s original/kernel
          test -s original/kernel_dtb
          test -s original/ramdisk.cpio

          echo
          echo "===== KERNEL ====="

          stat \
            -c '%n = %s bytes' \
            original/kernel

          file \
            original/kernel

          echo
          echo "===== DTB ====="

          stat \
            -c '%n = %s bytes' \
            original/kernel_dtb

          echo
          echo "===== RAMDISK ====="

          stat \
            -c '%n = %s bytes' \
            original/ramdisk.cpio

          echo
          echo "===== SHA256 ORIGINAL ====="

          sha256sum \
            original/kernel \
            original/kernel_dtb \
            original/ramdisk.cpio

          echo
          echo "Original boot structure OK."


      # ============================================================
      # 26. INSPECT NEW Image.gz-dtb
      # ============================================================
      - name: Inspect Image.gz-dtb
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "INSPECT Image.gz-dtb"
          echo "========================================"

          test -s Image.gz-dtb

          stat \
            -c '%n = %s bytes' \
            Image.gz-dtb

          file \
            Image.gz-dtb

          echo
          echo "===== GZIP HEADER ====="

          python3 - <<'PY'
          from pathlib import Path

          data = Path("Image.gz-dtb").read_bytes()

          if len(data) < 2:
              raise SystemExit("Image.gz-dtb terlalu kecil")

          if data[:2] != b'\x1f\x8b':
              raise SystemExit(
                  "ERROR: Image.gz-dtb bukan gzip"
              )

          print("GZIP header: OK")
          print("Image size:", len(data))
          PY


      # ============================================================
      # 27. SPLIT KERNEL GZIP + DTB
      # ============================================================
      - name: Split kernel gzip and DTB
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "SPLIT KERNEL GZIP + DTB"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          src = Path("Image.gz-dtb")
          data = src.read_bytes()

          print("Total Image.gz-dtb:", len(data))

          # Decompress the gzip stream.
          # unused_data contains everything appended after gzip,
          # which should be the DTB.
          obj = zlib.decompressobj(
              16 + zlib.MAX_WBITS
          )

          try:
              obj.decompress(data)
          except zlib.error as e:
              raise SystemExit(
                  f"ERROR: gzip decompression failed: {e}"
              )

          unused = obj.unused_data

          if not unused:
              raise SystemExit(
                  "ERROR: Tidak ada data setelah gzip. DTB tidak ditemukan."
              )

          gzip_size = len(data) - len(unused)

          kernel_gz = data[:gzip_size]
          dtb = unused

          print("Kernel gzip size:", len(kernel_gz))
          print("DTB size:", len(dtb))
          print("Gzip end offset:", gzip_size)

          # Verify DTB magic.
          if len(dtb) < 8:
              raise SystemExit(
                  "ERROR: DTB terlalu kecil."
              )

          if dtb[:4] != b'\xd0\x0d\xfe\xed':
              print(
                  "DTB first bytes:",
                  dtb[:16].hex()
              )
              raise SystemExit(
                  "ERROR: Data setelah gzip bukan DTB."
              )

          # DTB totalsize is big-endian at offset 4.
          totalsize = struct.unpack(
              ">I",
              dtb[4:8]
          )[0]

          print("DTB totalsize:", totalsize)

          if totalsize != len(dtb):
              raise SystemExit(
                  "ERROR: DTB totalsize tidak sama dengan ukuran DTB."
              )

          # Verify kernel gzip.
          if kernel_gz[:2] != b'\x1f\x8b':
              raise SystemExit(
                  "ERROR: kernel gzip tidak valid."
              )

          Path("new-kernel.gz").write_bytes(
              kernel_gz
          )

          Path("new-kernel-dtb").write_bytes(
              dtb
          )

          print()
          print("Split berhasil.")
          PY

          echo
          echo "===== TEST KERNEL GZIP ====="

          gzip -t new-kernel.gz

          echo "Kernel gzip OK."

          echo
          echo "===== NEW KERNEL ====="

          stat \
            -c '%n = %s bytes' \
            new-kernel.gz

          file \
            new-kernel.gz

          echo
          echo "===== NEW DTB ====="

          stat \
            -c '%n = %s bytes' \
            new-kernel-dtb

          file \
            new-kernel-dtb


      # ============================================================
      # 28. VERIFY KERNEL FORMAT
      # ============================================================
      - name: Verify kernel format
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "VERIFY KERNEL FORMAT"
          echo "========================================"

          echo "===== ORIGINAL KERNEL ====="

          file original/kernel

          echo
          echo "===== NEW KERNEL ====="

          file new-kernel.gz

          echo
          echo "===== ORIGINAL HEADER ====="

          xxd -l 16 original/kernel || true

          echo
          echo "===== NEW HEADER ====="

          xxd -l 16 new-kernel.gz

          echo
          echo "===== CHECK GZIP ====="

          python3 - <<'PY'
          from pathlib import Path

          original = Path("original/kernel").read_bytes()
          new = Path("new-kernel.gz").read_bytes()

          if original[:2] != b'\x1f\x8b':
              raise SystemExit(
                  "ERROR: kernel asli bukan gzip."
              )

          if new[:2] != b'\x1f\x8b':
              raise SystemExit(
                  "ERROR: kernel baru bukan gzip."
              )

          print("Original kernel: gzip")
          print("New kernel: gzip")
          print("Kernel format compatible.")
          PY


      # ============================================================
      # 29. VERIFY DTB
      # ============================================================
      - name: Verify DTB
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "VERIFY DTB"
          echo "========================================"

          echo "Original DTB:"
          stat \
            -c '%n = %s bytes' \
            original/kernel_dtb

          echo
          echo "New build DTB:"
          stat \
            -c '%n = %s bytes' \
            new-kernel-dtb

          echo
          echo "Original DTB akan dipertahankan."
          echo "New build DTB TIDAK akan dimasukkan ke boot.img."


      # ============================================================
      # 30. BACKUP + REPLACE ONLY KERNEL
      # ============================================================
      - name: Replace only kernel
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "REPLACE ONLY KERNEL"
          echo "========================================"

          cp \
            original/kernel \
            original/kernel.original

          cp \
            new-kernel.gz \
            original/kernel

          test -s original/kernel
          test -s original/kernel_dtb
          test -s original/ramdisk.cpio

          echo
          echo "===== SHA256 AFTER REPLACEMENT ====="

          sha256sum \
            original/kernel \
            original/kernel.original \
            original/kernel_dtb \
            original/ramdisk.cpio

          echo
          echo "Only kernel was replaced."
          echo "DTB preserved."
          echo "Ramdisk preserved."


      # ============================================================
      # 31. REPACK BOOT
      # ============================================================
      - name: Repack boot
        working-directory: boot-work/original
        run: |
          set -e

          echo "========================================"
          echo "REPACK BOOT"
          echo "========================================"

          rm -f ../boot-kernelsu.img

          ../magiskboot repack \
            ../boot-original.img \
            ../boot-kernelsu.img

          test -s ../boot-kernelsu.img

          echo
          echo "===== RESULT ====="

          stat \
            -c '%n = %s bytes' \
            ../boot-kernelsu.img

          file \
            ../boot-kernelsu.img

          echo
          echo "Repack successful."


      # ============================================================
      # 32. UNPACK FINAL BOOT FOR VERIFICATION
      # ============================================================
      - name: Verify final boot by unpacking
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "VERIFY FINAL BOOT"
          echo "========================================"

          rm -rf verify

          mkdir -p verify

          cd verify

          ../magiskboot unpack \
            ../boot-kernelsu.img

          echo
          echo "===== FINAL UNPACK ====="

          ls -lah

          test -s kernel
          test -s kernel_dtb
          test -s ramdisk.cpio

          echo
          echo "Final boot can be unpacked."


      # ============================================================
      # 33. VERIFY DTB UNCHANGED
      # ============================================================
      - name: Verify DTB unchanged
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "VERIFY DTB UNCHANGED"
          echo "========================================"

          echo "===== SHA256 ====="

          sha256sum \
            original/kernel_dtb \
            verify/kernel_dtb

          echo
          echo "===== BINARY COMPARE ====="

          cmp \
            original/kernel_dtb \
            verify/kernel_dtb

          echo
          echo "DTB unchanged: OK."


      # ============================================================
      # 34. VERIFY RAMDISK UNCHANGED
      # ============================================================
      - name: Verify ramdisk unchanged
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "VERIFY RAMDISK UNCHANGED"
          echo "========================================"

          echo "===== SHA256 ====="

          sha256sum \
            original/ramdisk.cpio \
            verify/ramdisk.cpio

          echo
          echo "===== BINARY COMPARE ====="

          cmp \
            original/ramdisk.cpio \
            verify/ramdisk.cpio

          echo
          echo "Ramdisk unchanged: OK."


      # ============================================================
      # 35. VERIFY KERNEL
      # ============================================================
      - name: Verify kernel replacement
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "VERIFY KERNEL REPLACEMENT"
          echo "========================================"

          echo "===== SHA256 ====="

          sha256sum \
            original/kernel.original \
            original/kernel \
            verify/kernel

          echo
          echo "===== FINAL KERNEL COMPARE ====="

          cmp \
            original/kernel \
            verify/kernel

          echo
          echo "Final kernel matches replaced kernel."

          echo
          echo "===== ENSURE KERNEL ACTUALLY CHANGED ====="

          if cmp -s \
            original/kernel.original \
            original/kernel
          then
            echo "ERROR: Kernel tidak berubah."
            exit 1
          fi

          echo
          echo "Kernel successfully replaced."


      # ============================================================
      # 36. VERIFY BOOT SIZE + HASH
      # ============================================================
      - name: Verify final boot image
        working-directory: boot-work
        run: |
          set -e

          echo "========================================"
          echo "FINAL RMX1821 KERNELSU BOOT"
          echo "========================================"

          test -s boot-original.img
          test -s boot-kernelsu.img
          test -s Image.gz-dtb

          echo
          echo "===== FILE SIZES ====="

          stat \
            -c '%n = %s bytes' \
            boot-original.img \
            boot-kernelsu.img \
            Image.gz-dtb

          echo
          echo "===== SHA256 ====="

          sha256sum \
            boot-original.img \
            boot-kernelsu.img \
            Image.gz-dtb

          sha256sum \
            boot-kernelsu.img \
            > boot-kernelsu.img.sha256

          echo
          echo "===== FINAL CHECKS ====="

          test -s boot-kernelsu.img
          test -s boot-kernelsu.img.sha256

          echo
          echo "FINAL BOOT IMAGE READY."


      # ============================================================
      # 37. CREATE BUILD INFO
      # ============================================================
      - name: Create build information
        working-directory: boot-work
        run: |
          set -e

          cat > BUILD_INFO.txt <<EOF
          RMX1821 KernelSU Build
          =====================

          Device:
          Realme 3 RMX1821

          Kernel source:
          Dark-Matter7232/CosmicFresh-RMX1821

          Kernel branch:
          Q

          KernelSU:
          v0.9.5

          Clang:
          r437112b

          Architecture:
          ARM64

          Original boot:
          boot-original.img

          Output boot:
          boot-kernelsu.img

          DTB:
          Original DTB preserved

          Ramdisk:
          Original ramdisk preserved

          Kernel:
          Replaced with newly built KernelSU kernel

          Verification:
          Final boot unpack successful
          DTB unchanged
          Ramdisk unchanged
          Kernel replacement verified
          EOF

          cat BUILD_INFO.txt


      # ============================================================
      # 38. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload final KernelSU boot
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-Boot
          path: |
            boot-work/boot-kernelsu.img
            boot-work/boot-kernelsu.img.sha256
            boot-work/Image.gz-dtb
            boot-work/BUILD_INFO.txt
          if-no-files-found: error