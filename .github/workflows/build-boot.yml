name: Build RMX1821 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      RMX_DEFCONFIG: RMX1821_defconfig

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout workflow repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd \
            file \
            xxd

          echo
          echo "========================================"
          echo "CHECK TOOLS"
          echo "========================================"

          docker --version
          python3 --version
          gcc --version


      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================

      - name: Clone RMX1821 kernel source
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

          cd kernel

          echo "Kernel source:"
          git log -1 --oneline

          echo
          echo "Kernel version:"
          grep -m1 "VERSION =" Makefile
          grep -m1 "PATCHLEVEL =" Makefile
          grep -m1 "SUBLEVEL =" Makefile


      # ============================================================
      # 4. INSTALL KERNELSU v0.9.5
      # ============================================================

      - name: Install KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash -s -- v0.9.5

          echo
          echo "Checking KernelSU..."

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU directory:"
          ls -la drivers/kernelsu


      # ============================================================
      # 5. PATCH CPU TARGET
      # ============================================================

      - name: Patch CPU target
        working-directory: kernel
        run: |
          set -e

          echo "Original CPU flags:"
          grep -n \
            -E "mcpu=|mtune=" \
            Makefile || true

          sed -i \
            's/-mcpu=cortex-a73\.cortex-a53/-mcpu=cortex-a53/g' \
            Makefile

          sed -i \
            's/-mtune=cortex-a73\.cortex-a53/-mtune=cortex-a53/g' \
            Makefile

          echo
          echo "Patched CPU flags:"
          grep -n \
            -E "mcpu=|mtune=" \
            Makefile || true


      # ============================================================
      # 6. PATCH STACK PROTECTOR
      # ============================================================

      - name: Disable incompatible stack protector options
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "PATCH STACK PROTECTOR"
          echo "========================================"

          CONFIG="arch/arm64/configs/${RMX_DEFCONFIG}"

          echo
          echo "Before:"
          grep -E \
            'CONFIG_CC_STACKPROTECTOR_(STRONG|REGULAR)' \
            "$CONFIG" || true

          sed -i \
            '/^CONFIG_CC_STACKPROTECTOR_STRONG=/d' \
            "$CONFIG"

          sed -i \
            '/^CONFIG_CC_STACKPROTECTOR_REGULAR=/d' \
            "$CONFIG"

          sed -i \
            '/^# CONFIG_CC_STACKPROTECTOR_STRONG is not set$/d' \
            "$CONFIG"

          sed -i \
            '/^# CONFIG_CC_STACKPROTECTOR_REGULAR is not set$/d' \
            "$CONFIG"

          cat >> "$CONFIG" <<'EOF'

          # KernelSU / GCC 4.9 compatibility
          # CONFIG_CC_STACKPROTECTOR_STRONG is not set
          # CONFIG_CC_STACKPROTECTOR_REGULAR is not set
          EOF

          echo
          echo "After:"
          grep -E \
            'CONFIG_CC_STACKPROTECTOR_(STRONG|REGULAR)' \
            "$CONFIG" || true

          echo
          echo "Stack protector configuration patched."


      # ============================================================
      # 7. PATCH sched_boost
      # ============================================================

      - name: Patch sched_boost declarations
        working-directory: kernel
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/sched.h")
          s = p.read_text()

          old1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);"""

          new1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif"""

          if old1 in s:
              s = s.replace(old1, new1, 1)
              print("Patched sched_boost declaration #1")
          else:
              print("sched_boost declaration #1 not found")

          old2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          new2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          if old2 in s:
              s = s.replace(old2, new2, 1)
              print("Patched sched_boost declaration #2")
          else:
              print("sched_boost declaration #2 not found")

          p.write_text(s)
          PY

          grep -n -A5 -B3 \
            "extern bool sched_boost" \
            include/linux/sched.h || true


      # ============================================================
      # 8. PATCH stack_trace
      # ============================================================

      - name: Patch stack_trace include
        working-directory: kernel
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/netdevice.h")
          s = p.read_text()

          if "#include <linux/stacktrace.h>" in s:
              print("stacktrace.h already included")
          else:
              marker = "#include <linux/stackdepot.h>"

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n#include <linux/stacktrace.h>",
                      1
                  )
                  print("Added stacktrace.h after stackdepot.h")
              else:
                  marker = "#include <linux/types.h>"

                  if marker in s:
                      s = s.replace(
                          marker,
                          marker + "\n#include <linux/stacktrace.h>",
                          1
                      )
                      print("Added stacktrace.h after types.h")
                  else:
                      raise SystemExit(
                          "Cannot find suitable include location"
                      )

          p.write_text(s)
          PY

          grep -n \
            "linux/stacktrace.h" \
            include/linux/netdevice.h


      # ============================================================
      # 9. INSTALL CLANG r437112b
      # ============================================================

      - name: Install Clang r437112b
        run: |
          set -e

          mkdir -p clang

          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/98603376816dd5a1fbb960856438124d4c618158/clang-r437112b.tar.gz" \
            -o clang-r437112b.tar.gz

          tar -xzf \
            clang-r437112b.tar.gz \
            -C clang

          rm -f clang-r437112b.tar.gz

          test -x clang/bin/clang

          chmod +x clang/bin/clang

          ./clang/bin/clang --version


      # ============================================================
      # 10. INSTALL GCC 4.9 AARCH64
      # ============================================================

      - name: Install GCC 4.9 AArch64
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          ./gcc64/bin/aarch64-linux-android-gcc --version


      # ============================================================
      # 11. INSTALL GCC 4.9 ARM32
      # ============================================================

      - name: Install GCC 4.9 ARM32
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          test -x gcc32/bin/arm-linux-androideabi-gcc

          ./gcc32/bin/arm-linux-androideabi-gcc --version


      # ============================================================
      # 12. SET TOOLCHAIN ENVIRONMENT
      # ============================================================

      - name: Configure toolchains
        run: |
          set -e

          echo "CC=${GITHUB_WORKSPACE}/clang/bin/clang" >> "$GITHUB_ENV"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE=${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

          echo
          echo "Toolchain configuration:"
          echo "CC=${GITHUB_WORKSPACE}/clang/bin/clang"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "CROSS_COMPILE=${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"
          echo "CROSS_COMPILE_ARM32=${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"


      # ============================================================
      # 13. INSTALL DRVGEN WRAPPER
      # ============================================================

      - name: Install DrvGen Python 2 wrapper
        working-directory: kernel
        run: |
          set -e

          cd tools/dct

          cp DrvGen.py DrvGen.py.real

          cat > DrvGen.py <<'PY'
          #!/usr/bin/env python3

          import os
          import subprocess
          import sys

          script_dir = os.path.dirname(
              os.path.realpath(__file__)
          )

          kernel_dir = os.path.realpath(
              os.path.join(script_dir, "../..")
          )

          dws = sys.argv[1]
          gen = sys.argv[2]
          log = sys.argv[3]
          param = sys.argv[4]

          def resolve_path(path):
              if os.path.isabs(path):
                  return os.path.realpath(path)

              return os.path.realpath(
                  os.path.join(os.getcwd(), path)
              )

          dws = resolve_path(dws)
          gen = resolve_path(gen)
          log = resolve_path(log)

          if dws.startswith(kernel_dir + os.sep):
              dws = "/workspace/" + dws[
                  len(kernel_dir) + 1:
              ]

          if gen.startswith(kernel_dir + os.sep):
              gen = "/workspace/" + gen[
                  len(kernel_dir) + 1:
              ]

          if log.startswith(kernel_dir + os.sep):
              log = "/workspace/" + log[
                  len(kernel_dir) + 1:
              ]

          cmd = [
              "docker",
              "run",
              "--rm",
              "-v",
              kernel_dir + ":/workspace",
              "-w",
              "/workspace/tools/dct",
              "python:2.7",
              "python2",
              "DrvGen.py.real",
              dws,
              gen,
              log,
              param,
          ]

          print("Running DrvGen:")
          print(" ".join(cmd))

          subprocess.check_call(cmd)
          PY

          chmod +x DrvGen.py

          echo "DrvGen wrapper installed."


      # ============================================================
      # 14. CLEAN BUILD OUTPUT
      # ============================================================

      - name: Clean kernel output
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "CLEAN KERNEL BUILD OUTPUT"
          echo "========================================"

          rm -rf out

          mkdir -p out

          echo "Build output cleaned."

          ls -la out


      # ============================================================
      # 15. GENERATE KERNEL CONFIGURATION
      # ============================================================

      - name: Generate kernel configuration
        working-directory: kernel
        env:
          ARCH: arm64
          CC: ${{ github.workspace }}/clang/bin/clang
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          set -e

          echo "========================================"
          echo "GENERATE CONFIGURATION"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            "$RMX_DEFCONFIG"

          test -f out/.config

          echo
          echo "Configuration generated."


      # ============================================================
      # 16. ENABLE KERNELSU
      # ============================================================

      - name: Enable KernelSU configuration
        working-directory: kernel
        env:
          ARCH: arm64
          CC: ${{ github.workspace }}/clang/bin/clang
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          set -e

          echo "========================================"
          echo "ENABLE KERNELSU"
          echo "========================================"

          scripts/config \
            --file out/.config \
            --enable KPROBES

          scripts/config \
            --file out/.config \
            --enable KSU

          scripts/config \
            --file out/.config \
            --disable CC_STACKPROTECTOR_STRONG

          scripts/config \
            --file out/.config \
            --disable CC_STACKPROTECTOR_REGULAR

          make \
            O=out \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          echo
          echo "KernelSU configuration:"

          grep -E \
            '^CONFIG_(KPROBES|KSU)=' \
            out/.config

          grep -q '^CONFIG_KPROBES=y$' out/.config
          grep -q '^CONFIG_KSU=y$' out/.config

          echo
          echo "KernelSU configuration verification: PASS"

      # ============================================================
      # 17. BUILD KERNEL
      # ============================================================

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CC: ${{ github.workspace }}/clang/bin/clang
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          set -e

          echo "========================================"
          echo "BUILD KERNEL"
          echo "========================================"

          echo
          echo "Checking configuration:"
          test -f out/.config
          grep -E '^CONFIG_(KPROBES|KSU)=' out/.config

          echo
          echo "Starting kernel build..."

          make \
            O=out \
            -j"$(nproc)" \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"

          echo
          echo "Checking kernel image..."

          test -f \
            out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "Kernel build successful."

          ls -lh \
            out/arch/arm64/boot/Image.gz-dtb

      # ============================================================
      # 18. VERIFY KERNEL BUILD
      # ============================================================

      - name: Verify kernel build
        working-directory: kernel
        run: |
          set -e

          echo "========================================"
          echo "VERIFY KERNEL BUILD"
          echo "========================================"

          test -f \
            out/arch/arm64/boot/Image.gz-dtb

          test -f \
            out/.config

          echo
          echo "Kernel image:"
          file \
            out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "Kernel size:"
          stat \
            -c "%s bytes" \
            out/arch/arm64/boot/Image.gz-dtb

          echo
          echo "Kernel configuration:"
          grep -E \
            '^CONFIG_(KPROBES|KSU)=' \
            out/.config

          echo
          echo "Kernel image verification: PASS"


      # ============================================================
      # 19. DOWNLOAD ORIGINAL BOOT
      # ============================================================

      - name: Download original boot image
        run: |
          set -e

          curl -L --fail --retry 3 \
            "https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img" \
            -o boot-original.img

          test -f boot-original.img

          echo "Original boot:"
          ls -lh boot-original.img

          echo
          echo "SHA256:"
          sha256sum boot-original.img


      # ============================================================
      # 20. CLONE MAGISK + SUBMODULES
      # ============================================================

      - name: Clone Magisk v31.1
        run: |
          set -e

          echo "========================================"
          echo "CLONE MAGISK v31.1"
          echo "========================================"

          git clone \
            --depth=1 \
            --branch v31.1 \
            --recurse-submodules \
            https://github.com/topjohnwu/Magisk.git \
            Magisk

          cd Magisk

          echo
          echo "Magisk commit:"
          git log -1 --oneline

          echo
          echo "Initializing submodules..."

          git submodule update \
            --init \
            --recursive

          echo
          echo "Checking cxx-rs..."

          test -f native/src/external/cxx-rs/Cargo.toml

          echo "cxx-rs found."

          echo
          echo "Submodule status:"
          git submodule status


      # ============================================================
      # 21. INSTALL MAGISK NDK
      # ============================================================

      - name: Install Magisk NDK
        working-directory: Magisk
        run: |
          set -e

          echo "========================================"
          echo "INSTALL MAGISK NDK"
          echo "========================================"

          python3 build.py ndk

          echo
          echo "Magisk NDK installation completed."


      # ============================================================
      # 22. BUILD MAGISKBOOT HOST
      # ============================================================

      - name: Build MagiskBoot
        working-directory: Magisk
        run: |
          set -e

          echo "========================================"
          echo "BUILD MAGISKBOOT"
          echo "========================================"

          test -f native/src/external/cxx-rs/Cargo.toml

          echo
          echo "Building Magisk native tools..."

          python3 build.py native

          echo
          echo "Searching for magiskboot..."

          find native \
            -type f \
            -name magiskboot \
            -print

          echo
          echo "Checking x86_64 binary..."

          HOST_MAGISKBOOT="native/out/x86_64/magiskboot"

          if [ ! -f "$HOST_MAGISKBOOT" ]; then
            echo "ERROR: x86_64 magiskboot tidak ditemukan."
            exit 1
          fi

          echo
          echo "File information:"

          file "$HOST_MAGISKBOOT"

          if ! file "$HOST_MAGISKBOOT" | grep -q "x86-64"; then
            echo "ERROR: magiskboot bukan x86_64."
            exit 1
          fi

          chmod +x "$HOST_MAGISKBOOT"

          echo
          echo "Checking executable permission..."

          test -x "$HOST_MAGISKBOOT"

          echo
          echo "MagiskBoot x86_64 build: PASS."


       # ============================================================
      # 23. PREPARE MAGISKBOOT WORK DIRECTORY
      # ============================================================

      - name: Prepare MagiskBoot working directory
        run: |
          set -e

          echo "========================================"
          echo "PREPARE MAGISKBOOT DIRECTORY"
          echo "========================================"

          rm -rf magiskboot
          mkdir -p magiskboot

          echo "Working directory:"
          pwd

          echo
          echo "MagiskBoot directory:"
          ls -ld magiskboot

      - name: Unpack original boot
        working-directory: magiskboot
        run: |
          set -e

          echo "========================================"
          echo "UNPACK ORIGINAL BOOT"
          echo "========================================"

          echo
          echo "Current directory:"
          pwd

          echo
          echo "Before unpack:"
          ls -lah

          echo
          echo "Running MagiskBoot..."

          ../Magisk/native/out/x86_64/magiskboot \
            unpack \
            ../boot-original.img

          echo
          echo "MagiskBoot exit: PASS"

          echo
          echo "After unpack:"
          ls -lah

          echo
          echo "Searching unpacked components:"
          find . -maxdepth 2 -type f -printf '%p  %s bytes\n' | sort


      # ============================================================
      # 24. SHOW ORIGINAL BOOT STRUCTURE
      # ============================================================

      - name: Inspect original boot structure
        working-directory: magiskboot
        run: |
          set -e

          echo "========================================"
          echo "ORIGINAL BOOT STRUCTURE"
          echo "========================================"

          echo
          echo "Kernel:"
          ls -lh original/kernel

          echo
          echo "Kernel DTB:"
          ls -lh original/kernel_dtb

          echo
          echo "Ramdisk:"
          ls -lh original/ramdisk.cpio

          echo
          echo "Kernel header:"
          xxd -l 64 original/kernel

          echo
          echo "Kernel format:"
          file original/kernel

          echo
          echo "DTB header:"
          xxd -l 32 original/kernel_dtb


      # ============================================================
      # 25. COPY NEW Image.gz-dtb
      # ============================================================

      - name: Copy new Image.gz-dtb
        working-directory: magiskboot
        run: |
          set -e

          cp \
            ../kernel/out/arch/arm64/boot/Image.gz-dtb \
            Image.gz-dtb

          test -f Image.gz-dtb

          echo "New Image.gz-dtb:"
          file Image.gz-dtb

          ls -lh Image.gz-dtb


      # ============================================================
      # 26. SPLIT GZIP KERNEL + DTB
      # ============================================================

      - name: Extract kernel gzip and DTB
        working-directory: magiskboot
        run: |
          set -e

          echo "========================================"
          echo "EXTRACT KERNEL GZIP + DTB"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import zlib
          import struct

          image = Path("Image.gz-dtb").read_bytes()

          print("Total Image.gz-dtb size:", len(image))

          if len(image) < 32:
              raise SystemExit(
                  "ERROR: Image.gz-dtb terlalu kecil."
              )

          if image[:2] != b'\x1f\x8b':
              raise SystemExit(
                  "ERROR: Image.gz-dtb tidak diawali gzip."
              )

          print("Gzip magic: PASS")

          d = zlib.decompressobj(
              16 + zlib.MAX_WBITS
          )

          try:
              kernel_decompressed = d.decompress(image)
          except zlib.error as e:
              raise SystemExit(
                  "ERROR: gzip kernel tidak valid: " + str(e)
              )

          if not d.eof:
              raise SystemExit(
                  "ERROR: gzip kernel tidak menemukan EOF."
              )

          kernel_gz_size = len(image) - len(d.unused_data)

          kernel_gz = image[:kernel_gz_size]
          dtb = d.unused_data

          print()
          print("Kernel decompressed size:", len(kernel_decompressed))
          print("Kernel gzip size        :", len(kernel_gz))
          print("DTB size                :", len(dtb))

          if len(kernel_decompressed) < 0x3c:
              raise SystemExit(
                  "ERROR: kernel hasil decompress terlalu kecil."
              )

          kernel_magic = kernel_decompressed[0x38:0x3c]

          print(
              "Kernel ARM64 magic      :",
              kernel_magic.hex()
          )

          if kernel_magic != b'ARM\x64':
              raise SystemExit(
                  "ERROR: gzip stream bukan ARM64 Linux Image."
              )

          if len(dtb) < 8:
              raise SystemExit(
                  "ERROR: DTB terlalu kecil."
              )

          if dtb[:4] != b'\xd0\x0d\xfe\xed':
              raise SystemExit(
                  "ERROR: data setelah gzip bukan DTB. "
                  "Magic=" + dtb[:4].hex()
              )

          totalsize = struct.unpack(
              ">I",
              dtb[4:8]
          )[0]

          print(
              "DTB magic               :",
              dtb[:4].hex()
          )

          print(
              "DTB header totalsize    :",
              totalsize
          )

          print(
              "DTB actual size         :",
              len(dtb)
          )

          if totalsize != len(dtb):
              raise SystemExit(
                  "ERROR: ukuran DTB tidak cocok. "
                  f"header={totalsize}, "
                  f"actual={len(dtb)}"
              )

          Path(
              "new-kernel.gz"
          ).write_bytes(kernel_gz)

          Path(
              "new-kernel-dtb"
          ).write_bytes(dtb)

          print()
          print("Kernel gzip + DTB extraction: PASS")
          PY

          echo
          echo "Testing gzip integrity..."

          gzip -t new-kernel.gz

          test -s new-kernel.gz
          test -s new-kernel-dtb

          echo
          echo "Kernel gzip:"
          file new-kernel.gz

          echo
          echo "DTB:"
          file new-kernel-dtb


      # ============================================================
      # 27. DECOMPRESS NEW KERNEL TO ARM64 IMAGE
      # ============================================================

      - name: Prepare new ARM64 kernel
        working-directory: magiskboot
        run: |
          set -e

          echo "========================================"
          echo "PREPARE ARM64 KERNEL"
          echo "========================================"

          gzip -dc \
            new-kernel.gz \
            > new-kernel

          test -s new-kernel

          echo
          echo "New kernel:"
          file new-kernel

          python3 - <<'PY'
          from pathlib import Path

          kernel = Path(
              "new-kernel"
          ).read_bytes()

          if len(kernel) < 0x3c:
              raise SystemExit(
                  "ERROR: kernel terlalu kecil."
              )

          magic = kernel[0x38:0x3c]

          print(
              "ARM64 Image magic:",
              magic.hex()
          )

          print(
              "Kernel size:",
              len(kernel)
          )

          if magic != b'ARM\x64':
              raise SystemExit(
                  "ERROR: hasil decompress "
                  "bukan ARM64 Linux Image."
              )

          print(
              "ARM64 kernel valid."
          )

          print(
              "Kernel preparation: PASS"
          )
          PY

      # ============================================================
      # 28. VERIFY ORIGINAL / NEW KERNEL
      # ============================================================

      - name: Verify kernel formats
        working-directory: magiskboot
        run: |
          set -e

          echo "========================================"
          echo "VERIFY KERNEL FORMATS"
          echo "========================================"

          echo
          echo "===== ORIGINAL ====="
          file original/kernel

          echo
          echo "===== NEW ====="
          file new-kernel

          echo
          echo "===== ORIGINAL HEADER ====="
          xxd -l 64 original/kernel

          echo
          echo "===== NEW HEADER ====="
          xxd -l 64 new-kernel

          python3 - <<'PY'
          from pathlib import Path

          original = Path(
              "original/kernel"
          ).read_bytes()

          new = Path(
              "new-kernel"
          ).read_bytes()

          if len(original) < 0x3c:
              raise SystemExit(
                  "ERROR: original kernel terlalu kecil."
              )

          if len(new) < 0x3c:
              raise SystemExit(
                  "ERROR: new kernel terlalu kecil."
              )

          original_magic = \
              original[0x38:0x3c]

          new_magic = \
              new[0x38:0x3c]

          print(
              "Original magic:",
              original_magic.hex()
          )

          print(
              "New magic:",
              new_magic.hex()
          )

          if original_magic != b'ARM\x64':
              raise SystemExit(
                  "ERROR: original bukan ARM64 Image."
              )

          if new_magic != b'ARM\x64':
              raise SystemExit(
                  "ERROR: new bukan ARM64 Image."
              )

          print(
              "Original kernel: ARM64 Image"
          )

          print(
              "New kernel: ARM64 Image"
          )

          print(
              "Kernel format compatible."
          )
          PY


      # ============================================================
      # 29. BACKUP ORIGINAL COMPONENTS
      # ============================================================

      - name: Backup original boot components
        working-directory: magiskboot
        run: |
          set -e

          cp \
            original/kernel \
            original/kernel.original

          cp \
            original/kernel_dtb \
            original/kernel_dtb.original

          cp \
            original/ramdisk.cpio \
            original/ramdisk.cpio.original

          echo "Original components backed up."


      # ============================================================
      # 30. REPLACE ONLY KERNEL
      # ============================================================

      - name: Replace kernel
        working-directory: magiskboot
        run: |
          set -e

          echo "========================================"
          echo "REPLACE KERNEL"
          echo "========================================"

          cp \
            new-kernel \
            original/kernel

          echo
          echo "New kernel:"
          file original/kernel

          echo
          echo "Original DTB preserved:"
          cmp \
            original/kernel_dtb \
            original/kernel_dtb.original

          echo "DTB unchanged."

          echo
          echo "Original ramdisk preserved:"
          cmp \
            original/ramdisk.cpio \
            original/ramdisk.cpio.original

          echo "Ramdisk unchanged."


      # ============================================================
      # 31. REPACK BOOT
      # ============================================================

      - name: Repack KernelSU boot image
        working-directory: magiskboot
        run: |
          set -e

          echo "========================================"
          echo "REPACK BOOT IMAGE"
          echo "========================================"

          ../Magisk/native/out/x86_64/magiskboot \
            repack \
            ../boot-original.img \
            ../boot-kernelsu.img

          test -f ../boot-kernelsu.img

          echo
          echo "Boot image created:"
          ls -lh ../boot-kernelsu.img

          echo
          echo "SHA256:"
          sha256sum ../boot-kernelsu.img


      # ============================================================
      # 32. UNPACK FINAL BOOT FOR VERIFICATION
      # ============================================================

      - name: Verify final boot image
        run: |
          set -e

          mkdir -p final-check

          cp \
            boot-kernelsu.img \
            final-check/boot-kernelsu.img

          cd final-check

          ../Magisk/native/out/x86_64/magiskboot \
            unpack \
            boot-kernelsu.img

          echo
          echo "Final boot components:"
          ls -lah original


      # ============================================================
      # 33. VERIFY DTB
      # ============================================================

      - name: Verify DTB unchanged
        working-directory: final-check
        run: |
          set -e

          cmp \
            original/kernel_dtb \
            ../magiskboot/original/kernel_dtb.original

          echo "DTB verification: PASS"


      # ============================================================
      # 34. VERIFY RAMDISK
      # ============================================================

      - name: Verify ramdisk unchanged
        working-directory: final-check
        run: |
          set -e

          cmp \
            original/ramdisk.cpio \
            ../magiskboot/original/ramdisk.cpio.original

          echo "Ramdisk verification: PASS"


      # ============================================================
      # 35. VERIFY FINAL KERNEL
      # ============================================================

      - name: Verify final kernel
        working-directory: final-check
        run: |
          set -e

          echo "Final kernel:"
          file original/kernel

          python3 - <<'PY'
          from pathlib import Path

          kernel = Path(
              "original/kernel"
          ).read_bytes()

          if len(kernel) < 0x3c:
              raise SystemExit(
                  "ERROR: final kernel terlalu kecil."
              )

          magic = kernel[
              0x38:0x3c
          ]

          print(
              "Final kernel magic:",
              magic.hex()
          )

          if magic != b'ARM\x64':
              raise SystemExit(
                  "ERROR: final kernel bukan ARM64 Image."
              )

          print(
              "Final kernel verification: PASS"
          )
          PY


      # ============================================================
      # 36. FINAL SHA256
      # ============================================================

      - name: Final boot image information
        run: |
          set -e

          echo "========================================"
          echo "FINAL RESULT"
          echo "========================================"

          echo
          echo "File:"
          ls -lh boot-kernelsu.img

          echo
          echo "SHA256:"
          sha256sum boot-kernelsu.img

          echo
          echo "Original boot SHA256:"
          sha256sum boot-original.img

          echo
          echo "Final boot image:"
          file boot-kernelsu.img


      # ============================================================
      # 37. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload KernelSU boot image
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-boot
          path: |
            boot-kernelsu.img
            boot-original.img
          if-no-files-found: error