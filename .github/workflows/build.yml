name: Build RMX1821 KernelSU v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python2 \
            python2-minimal \
            zip

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          python --version

      - name: Download kernel source
        run: |
          rm -rf kernel kernel.tar.gz

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o kernel.tar.gz \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821/archive/refs/heads/Q.tar.gz

          tar -xzf kernel.tar.gz
          mv CosmicFresh-RMX1821-Q kernel

          test -f kernel/tools/dct/DrvGen.py
          chmod +x kernel/tools/dct/DrvGen.py

          du -sh kernel

      - name: Download Android toolchains
        working-directory: kernel
        run: |
          mkdir -p toolchain
          cd toolchain

          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git \
            clang

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Integrate KernelSU
        working-directory: kernel
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export KBUILD_OUTPUT="$PWD/out"
          export KCONFIG_CONFIG="$PWD/out/.config"

          rm -rf out
          rm -f .config
          rm -rf include/config

          echo "===== Base config ====="
          make RMX1821_defconfig

          test -f out/.config

          echo "===== KernelSU configuration ====="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          echo "===== Existing KPROBES configuration ====="
          grep -E '^CONFIG_(KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=' \
            out/.config || true

          echo "===== olddefconfig ====="
          make olddefconfig

          echo "===== Final KernelSU configuration ====="
          grep -E '^CONFIG_KSU=' out/.config || true

          echo "===== Final KPROBES configuration ====="
          grep -E '^CONFIG_(KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=' \
            out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export KBUILD_OUTPUT="$PWD/out"
          export PATH="$PWD/toolchain/clang/bin:$PATH"

          make -j$(nproc) \
            ARCH=arm64 \
            KBUILD_OUTPUT="$PWD/out" \
            KCONFIG_CONFIG="$PWD/out/.config" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/toolchain/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$PWD/toolchain/gcc32/bin/arm-linux-androideabi-" \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            Image.gz-dtb

      - name: Check output
        working-directory: kernel
        run: |
          set -eux

          ls -lh out/arch/arm64/boot/

          file out/arch/arm64/boot/Image.gz-dtb

          echo "===== Kernel size ====="
          stat -c "%s bytes" out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v2
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error