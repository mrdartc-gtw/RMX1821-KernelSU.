name: Build RMX1821 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT WORKFLOW REPOSITORY
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          echo "===== INSTALL DEPENDENCIES ====="

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

          echo "===== VERSIONS ====="

          git --version
          python3 --version
          docker --version

      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone RMX1821 kernel source
        run: |
          set -e

          echo "===== CLONE COSMICFRESH ====="

          git clone \
            --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

          echo "===== VERIFY KERNEL ====="

          test -f kernel/Makefile
          test -d kernel/arch
          test -d kernel/drivers
          test -d kernel/include

          echo "Kernel source OK."

          echo "===== KERNEL ROOT ====="

          ls -lah kernel | head -50

      # ============================================================
      # 4. SHOW KERNEL INFORMATION
      # ============================================================
      - name: Check kernel source
        run: |
          set -e

          cd kernel

          echo "===== KERNEL COMMIT ====="
          git log -1 --oneline

          echo "===== KERNEL VERSION ====="
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile | head

          echo "===== ARCHITECTURES ====="
          ls -ld arch/arm64

      # ============================================================
      # 5. INSTALL CLANG r437112b
      # ============================================================
      - name: Install Clang r437112b
        run: |
          set -e

          echo "===== DOWNLOAD CLANG r437112b ====="

          mkdir -p clang

          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/98603376816dd5a1fbb960856438124d4c618158/clang-r437112b.tar.gz" \
            -o clang-r437112b.tar.gz

          echo "===== CHECK ARCHIVE ====="

          ls -lh clang-r437112b.tar.gz

          echo "===== EXTRACT ====="

          tar -xzf clang-r437112b.tar.gz -C clang

          rm -f clang-r437112b.tar.gz

          echo "===== VERIFY CLANG ====="

          test -x clang/bin/clang

          chmod +x clang/bin/clang

          ./clang/bin/clang --version

          echo "===== CLANG READY ====="

      # ============================================================
      # 6. INSTALL GCC 4.9 AARCH64
      # ============================================================
      - name: Install GCC 4.9 AArch64
        run: |
          set -e

          echo "===== GCC64 ====="

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          gcc64/bin/aarch64-linux-android-gcc --version

      # ============================================================
      # 7. INSTALL GCC 4.9 ARM32
      # ============================================================
      - name: Install GCC 4.9 ARM32
        run: |
          set -e

          echo "===== GCC32 ====="

          git clone \
            --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          test -x gcc32/bin/arm-linux-androideabi-gcc

          gcc32/bin/arm-linux-androideabi-gcc --version

      # ============================================================
      # 8. SET TOOLCHAIN ENVIRONMENT
      # ============================================================
      - name: Configure toolchain
        run: |
          set -e

          echo "ARCH=arm64" >> "$GITHUB_ENV"

          echo "CC=${{ github.workspace }}/clang/bin/clang" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=${{ github.workspace }}/gcc64/bin/aarch64-linux-android-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE_ARM32=${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

          echo "===== TOOLCHAIN ENVIRONMENT ====="

          echo "ARCH=arm64"
          echo "CC=${{ github.workspace }}/clang/bin/clang"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "CROSS_COMPILE=${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          echo "CROSS_COMPILE_ARM32=${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

      # ============================================================
      # 9. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify toolchain
        run: |
          set -e

          export ARCH=arm64

          export CC="${{ github.workspace }}/clang/bin/clang"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== VERIFY CLANG ====="

          test -x "$CC"
          "$CC" --version

          echo "===== VERIFY GCC64 ====="

          test -x "${CROSS_COMPILE}gcc"
          "${CROSS_COMPILE}gcc" --version

          echo "===== VERIFY GCC32 ====="

          test -x "${CROSS_COMPILE_ARM32}gcc"
          "${CROSS_COMPILE_ARM32}gcc" --version

          echo "===== TOOLCHAIN OK ====="

      # ============================================================
      # 10. PATCH CPU TARGET
      # ============================================================
      - name: Fix CPU target
        working-directory: kernel
        run: |
          set -e

          echo "===== PATCH CPU TARGET ====="

          sed -i \
            's/-mcpu=cortex-a73\.cortex-a53/-mcpu=cortex-a53/g' \
            Makefile

          sed -i \
            's/-mtune=cortex-a73\.cortex-a53/-mtune=cortex-a53/g' \
            Makefile

          echo "===== VERIFY CPU TARGET ====="

          grep -n \
            -E 'mcpu=|mtune=' \
            Makefile | head -30

      # ============================================================
      # 11. INTEGRATE KERNELSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e

          echo "===== INSTALL KERNELSU v0.9.5 ====="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash -s -- v0.9.5

          echo "===== VERIFY KERNELSU ====="

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "===== KERNELSU OK ====="

      # ============================================================
      # 12. FIND DEFCONFIG
      # ============================================================
      - name: Find ARM64 defconfig
        working-directory: kernel
        run: |
          set -e

          echo "===== SEARCH DEFCONFIG ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo "===== POSSIBLE RMX / OPPO / MT6771 CONFIGS ====="

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*rmx*' -o \
              -iname '*oppo*' -o \
              -iname '*6771*' -o \
              -iname '*mtk*' \
            \) \
            -print \
            | sort

      # ============================================================
      # 13. SELECT DEFCONFIG
      # ============================================================
      - name: Select RMX1821 defconfig
        working-directory: kernel
        run: |
          set -e

          echo "===== SELECT DEFCONFIG ====="

          CONFIG=""

          for candidate in \
            rmx1821_defconfig \
            RMX1821_defconfig \
            oppo6771_18601_defconfig \
            mt6771_defconfig \
            oppo6771_defconfig
          do
            if [ -f "arch/arm64/configs/$candidate" ]; then
              CONFIG="$candidate"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "ERROR: RMX1821-compatible defconfig tidak ditemukan."
            echo
            echo "Available defconfig:"
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            exit 1
          fi

          echo "Selected defconfig: $CONFIG"

          echo "RMX_DEFCONFIG=$CONFIG" >> "$GITHUB_ENV"

      # ============================================================
      # 14. CREATE BASE CONFIG
      # ============================================================
      - name: Create base kernel config
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64

          export CC="${{ github.workspace }}/clang/bin/clang"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== CREATE BASE CONFIG ====="

          rm -rf out

          mkdir -p out

          make \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            "$RMX_DEFCONFIG"

          test -f out/.config

          echo "===== BASE CONFIG CREATED ====="

      # ============================================================
      # 15. APPLY KERNELSU CONFIG
      # ============================================================
      - name: Configure KernelSU
        working-directory: kernel
        run: |
          set -e

          echo "===== CONFIGURE KERNELSU ====="

          scripts/config \
            --file out/.config \
            -e CONFIG_KPROBES

          scripts/config \
            --file out/.config \
            -e CONFIG_KSU

          scripts/config \
            --file out/.config \
            --set-val LITTLE_CPU_MASK 15

          scripts/config \
            --file out/.config \
            --set-val BIG_CPU_MASK 240

          scripts/config \
            --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG

          scripts/config \
            --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR

          echo "===== KSU CONFIG ====="

          grep -E \
            'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_LITTLE_CPU_MASK=|CONFIG_BIG_CPU_MASK=' \
            out/.config || true

      # ============================================================
      # 16. PATCH sched_boost
      # ============================================================
      - name: Fix sched_boost declaration
        working-directory: kernel
        run: |
          set -e

          echo "===== PATCH sched_boost ====="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/sched.h")
          s = p.read_text()

          old1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);"""

          new1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif"""

          if old1 in s:
              s = s.replace(old1, new1, 1)

          old2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          new2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          if old2 in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s)

          print("sched_boost patch applied")
          PY

          echo "===== VERIFY sched_boost ====="

          grep -n -B5 -A10 "sched_boost" \
            include/linux/sched.h

      # ============================================================
      # 17. PATCH stack_trace
      # ============================================================
      - name: Fix stack_trace incomplete type
        working-directory: kernel
        run: |
          set -e

          echo "===== PATCH stack_trace ====="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/netdevice.h")
          s = p.read_text()

          if "#include <linux/stacktrace.h>" not in s:

              if "#include <linux/stackdepot.h>" in s:
                  s = s.replace(
                      "#include <linux/stackdepot.h>",
                      "#include <linux/stackdepot.h>\n#include <linux/stacktrace.h>",
                      1
                  )

              elif "#include <linux/types.h>" in s:
                  s = s.replace(
                      "#include <linux/types.h>",
                      "#include <linux/types.h>\n#include <linux/stacktrace.h>",
                      1
                  )

              else:
                  raise SystemExit(
                      "Tidak menemukan lokasi include stacktrace.h"
                  )

              p.write_text(s)

          print("stacktrace.h included")
          PY

          grep -n "stacktrace.h" \
            include/linux/netdevice.h

      # ============================================================
      # 18. OLDDEFCONFIG
      # ============================================================
      - name: Run olddefconfig
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64

          export CC="${{ github.workspace }}/clang/bin/clang"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== OLDDEFCONFIG ====="

          echo "ARCH=$ARCH"
          echo "CC=$CC"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"

          test -f out/.config

          make \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            olddefconfig

          echo "===== OLDDEFCONFIG SUCCESS ====="

      # ============================================================
      # 19. PREPARE DRVGEN
      # ============================================================
      - name: Prepare DrvGen
        working-directory: kernel
        run: |
          set -e

          echo "===== PREPARE DRVGEN ====="

          cd tools/dct

          test -f DrvGen.py

          if [ ! -f DrvGen.py.real ]; then
            cp DrvGen.py DrvGen.py.real
          fi

          cat > DrvGen.py <<'EOF'
          #!/bin/sh
          set -e

          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          KERNEL_DIR="$(CDPATH= cd -- "$SCRIPT_DIR/../.." && pwd)"

          DWS="$1"
          GEN="$2"
          LOG="$3"
          PARAM="$4"

          if [ -z "$DWS" ] || [ -z "$GEN" ] || [ -z "$LOG" ]; then
            echo "DrvGen wrapper: missing arguments"
            exit 1
          fi

          resolve_path() {
            TARGET="$1"

            case "$TARGET" in
              /*)
                printf '%s\n' "$TARGET"
                ;;
              *)
                printf '%s/%s\n' "$(pwd)" "$TARGET"
                ;;
            esac
          }

          DWS="$(resolve_path "$DWS")"
          GEN="$(resolve_path "$GEN")"
          LOG="$(resolve_path "$LOG")"

          case "$DWS" in
            "$KERNEL_DIR"/*)
              DWS="/workspace/${DWS#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$GEN" in
            "$KERNEL_DIR"/*)
              GEN="/workspace/${GEN#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$LOG" in
            "$KERNEL_DIR"/*)
              LOG="/workspace/${LOG#"$KERNEL_DIR"/}"
              ;;
          esac

          echo "[DrvGen wrapper] DWS=$DWS"
          echo "[DrvGen wrapper] GEN=$GEN"
          echo "[DrvGen wrapper] LOG=$LOG"

          exec docker run --rm \
            -v "$KERNEL_DIR:/workspace" \
            -w /workspace/tools/dct \
            python:2.7 \
            python2 DrvGen.py.real \
            "$DWS" \
            "$GEN" \
            "$LOG" \
            "$PARAM"
          EOF

          chmod +x DrvGen.py

          echo "===== DRVGEN READY ====="

      # ============================================================
      # 20. VERIFY DWS
      # ============================================================
      - name: Verify RMX1821 DWS
        working-directory: kernel
        run: |
          set -e

          DWS="drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws"

          echo "===== CHECK DWS ====="

          if [ ! -f "$DWS" ]; then
            echo "ERROR: DWS tidak ditemukan:"
            find drivers/misc/mediatek/dws \
              -type f \
              -name '*.dws' \
              -print
            exit 1
          fi

          echo "DWS found:"
          echo "$DWS"

      # ============================================================
      # 21. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64

          export CC="${{ github.workspace }}/clang/bin/clang"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== BUILD KERNEL ====="

          make \
            -j"$(nproc)" \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out

          echo "===== CHECK OUTPUT ====="

          ls -lah out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "===== IMAGE.gz-dtb FOUND ====="

          file out/arch/arm64/boot/Image.gz-dtb

          stat \
            -c '%n %s bytes' \
            out/arch/arm64/boot/Image.gz-dtb

      # ============================================================
      # 22. UPLOAD KERNEL
      # ============================================================
      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-Image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error