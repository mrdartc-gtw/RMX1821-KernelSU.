name: Build RMX1821 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zstd

          docker --version
          python3 --version

      # ============================================================
      # 3. CLANG r437112b
      # ============================================================
      - name: Install Clang r437112b
        run: |
          set -e

          echo "===== DOWNLOAD CLANG r437112b ====="

          mkdir -p clang

          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/98603376816dd5a1fbb960856438124d4c618158/clang-r437112b.tar.gz" \
            -o clang-r437112b.tar.gz

          echo "===== EXTRACT CLANG ====="

          tar -xzf clang-r437112b.tar.gz -C clang

          rm -f clang-r437112b.tar.gz

          echo "===== VERIFY CLANG ====="

          test -x clang/bin/clang

          chmod +x clang/bin/clang

          ./clang/bin/clang --version

          echo "===== CLANG READY ====="

      # ============================================================
      # 4. GCC 4.9 AARCH64
      # ============================================================
      - name: Install GCC 4.9 AArch64
        run: |
          set -e

          echo "===== CLONE GCC 4.9 AARCH64 ====="

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          test -x gcc64/bin/aarch64-linux-android-gcc

          echo "===== GCC64 ====="

          gcc64/bin/aarch64-linux-android-gcc --version

      # ============================================================
      # 5. GCC 4.9 ARM32
      # ============================================================
      - name: Install GCC 4.9 ARM32
        run: |
          set -e

          echo "===== CLONE GCC 4.9 ARM32 ====="

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          test -x gcc32/bin/arm-linux-androideabi-gcc

          echo "===== GCC32 ====="

          gcc32/bin/arm-linux-androideabi-gcc --version

      # ============================================================
      # 6. DEFINE TOOLCHAIN
      # ============================================================
      - name: Configure toolchain
        run: |
          set -e

          echo "===== TOOLCHAIN ====="

          echo "ARCH=arm64" >> "$GITHUB_ENV"

          echo "CC=${{ github.workspace }}/clang/bin/clang" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=${{ github.workspace }}/gcc64/bin/aarch64-linux-android-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE_ARM32=${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-" >> "$GITHUB_ENV"

          echo "===== TOOLCHAIN CONFIGURED ====="

      # ============================================================
      # 7. VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify toolchain
        run: |
          set -e

          export ARCH=arm64
          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "ARCH=$ARCH"
          echo "CC=$CC"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"

          test -x "$CC"
          test -x "${CROSS_COMPILE}gcc"
          test -x "${CROSS_COMPILE_ARM32}gcc"

          "$CC" --version

          "${CROSS_COMPILE}gcc" --version

          "${CROSS_COMPILE_ARM32}gcc" --version

      # ============================================================
      # 8. PATCH CPU TARGET
      # ============================================================
      - name: Fix CPU target
        working-directory: kernel
        run: |
          set -e

          echo "===== PATCH CPU TARGET ====="

          sed -i \
            's/-mcpu=cortex-a73\.cortex-a53/-mcpu=cortex-a53/g' \
            Makefile

          sed -i \
            's/-mtune=cortex-a73\.cortex-a53/-mtune=cortex-a53/g' \
            Makefile

          echo "===== VERIFY CPU TARGET ====="

          grep -n \
            -E 'mcpu=|mtune=' \
            Makefile | head -30

      # ============================================================
      # 9. INTEGRATE KERNELSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e

          echo "===== INSTALL KERNELSU v0.9.5 ====="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash -s -- v0.9.5

          echo "===== VERIFY KERNELSU ====="

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU integration: OK"

      # ============================================================
      # 10. PATCH STACK PROTECTOR
      # ============================================================
      - name: Disable unsupported stack protector
        working-directory: kernel
        run: |
          set -e

          echo "===== DISABLE STACK PROTECTOR ====="

          mkdir -p out

          if [ -f out/.config ]; then
            scripts/config \
              --file out/.config \
              -d CONFIG_CC_STACKPROTECTOR_STRONG \
              -d CONFIG_CC_STACKPROTECTOR_REGULAR
          else
            echo "out/.config belum ada, dilewati"
          fi

      # ============================================================
      # 11. PREPARE CONFIG
      # ============================================================
      - name: Prepare kernel config
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== PREPARE CONFIG ====="

          mkdir -p out

          if [ ! -f out/.config ]; then
            echo "ERROR: out/.config tidak ditemukan"
            exit 1
          fi

          scripts/config \
            --file out/.config \
            -e CONFIG_KPROBES \
            -e CONFIG_KSU

          scripts/config \
            --file out/.config \
            --set-val LITTLE_CPU_MASK 15 \
            --set-val BIG_CPU_MASK 240

          scripts/config \
            --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR

          echo "===== CONFIG CHECK ====="

          grep -E \
            'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_LITTLE_CPU_MASK=|CONFIG_BIG_CPU_MASK=' \
            out/.config || true

      # ============================================================
      # 12. FIX sched_boost
      # ============================================================
      - name: Fix sched_boost declaration
        working-directory: kernel
        run: |
          set -e

          echo "===== PATCH sched_boost ====="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/sched.h")
          s = p.read_text()

          old1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);"""

          new1 = """#ifdef VENDOR_EDIT

          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif"""

          if old1 in s:
              s = s.replace(old1, new1, 1)

          old2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          extern bool sched_boost(void);
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          new2 = """#ifdef VENDOR_EDIT
          //cuixiaogang@swdp.shanghai, 2018/3/18, export some symbol
          #ifdef CONFIG_MTK_SCHED_BOOST
          extern bool sched_boost(void);
          #endif
          extern int sched_set_updown_migrate(unsigned int up_migrate,unsigned int down_migrate);"""

          if old2 in s:
              s = s.replace(old2, new2, 1)

          p.write_text(s)

          print("sched_boost patch applied")
          PY

          echo "===== VERIFY sched_boost ====="

          grep -n -B5 -A10 "sched_boost" \
            include/linux/sched.h

      # ============================================================
      # 13. FIX stack_trace
      # ============================================================
      - name: Fix stack_trace incomplete type
        working-directory: kernel
        run: |
          set -e

          echo "===== CHECK stacktrace ====="

          grep -n \
            -B5 -A8 \
            "struct stack_trace" \
            include/linux/netdevice.h || true

          echo "===== APPLY PATCH ====="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("include/linux/netdevice.h")
          s = p.read_text()

          if "#include <linux/stacktrace.h>" in s:
              print("stacktrace.h already included")
          else:
              marker = "#include <linux/stackdepot.h>"

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + "\n#include <linux/stacktrace.h>",
                      1
                  )
                  print("Added stacktrace.h after stackdepot.h")

              else:
                  marker = "#include <linux/types.h>"

                  if marker not in s:
                      raise SystemExit(
                          "ERROR: include location not found"
                      )

                  s = s.replace(
                      marker,
                      marker + "\n#include <linux/stacktrace.h>",
                      1
                  )

                  print("Added stacktrace.h after types.h")

              p.write_text(s)
          PY

          echo "===== VERIFY ====="

          grep -n \
            "stacktrace.h" \
            include/linux/netdevice.h

          echo "stack_trace patch OK"

      # ============================================================
      # 14. CHECK CONFIG BEFORE OLDDEFCONFIG
      # ============================================================
      - name: Check configuration
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== CHECK CONFIG ====="

          test -f out/.config

          grep -E \
            'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_LITTLE_CPU_MASK=|CONFIG_BIG_CPU_MASK=' \
            out/.config || true

      # ============================================================
      # 15. OLDDEFCONFIG
      # ============================================================
      - name: Run olddefconfig
        working-directory: kernel
        run: |
          set -e

          echo "===== OLDDEFCONFIG ====="

          export ARCH=arm64
          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "ARCH=$ARCH"
          echo "CC=$CC"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"

          test -x "$CC"
          test -x "${CROSS_COMPILE}gcc"
          test -x "${CROSS_COMPILE_ARM32}gcc"

          make \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            olddefconfig

          echo "===== OLDDEFCONFIG SUCCESS ====="

      # ============================================================
      # 16. DRVGEN
      # ============================================================
      - name: Prepare DrvGen
        working-directory: kernel
        run: |
          set -e

          echo "===== PREPARE DRVGEN ====="

          cd tools/dct

          if [ ! -f DrvGen.py.real ]; then
            cp DrvGen.py DrvGen.py.real
          fi

          cat > DrvGen.py <<'EOF'
          #!/bin/sh
          set -e

          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          KERNEL_DIR="$(CDPATH= cd -- "$SCRIPT_DIR/../.." && pwd)"

          DWS="$1"
          GEN="$2"
          LOG="$3"
          PARAM="$4"

          if [ -z "$DWS" ] || [ -z "$GEN" ] || [ -z "$LOG" ]; then
            echo "DrvGen wrapper: missing arguments"
            exit 1
          fi

          resolve_path() {
            TARGET="$1"

            case "$TARGET" in
              /*)
                printf '%s\n' "$TARGET"
                ;;
              *)
                printf '%s/%s\n' "$(pwd)" "$TARGET"
                ;;
            esac
          }

          DWS="$(resolve_path "$DWS")"
          GEN="$(resolve_path "$GEN")"
          LOG="$(resolve_path "$LOG")"

          case "$DWS" in
            "$KERNEL_DIR"/*)
              DWS="/workspace/${DWS#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$GEN" in
            "$KERNEL_DIR"/*)
              GEN="/workspace/${GEN#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$LOG" in
            "$KERNEL_DIR"/*)
              LOG="/workspace/${LOG#"$KERNEL_DIR"/}"
              ;;
          esac

          echo "[DrvGen wrapper] DWS=$DWS"
          echo "[DrvGen wrapper] GEN=$GEN"
          echo "[DrvGen wrapper] LOG=$LOG"

          exec docker run --rm \
            -v "$KERNEL_DIR:/workspace" \
            -w /workspace/tools/dct \
            python:2.7 \
            python2 DrvGen.py.real \
            "$DWS" \
            "$GEN" \
            "$LOG" \
            "$PARAM"
          EOF

          chmod +x DrvGen.py

          echo "===== DRVGEN READY ====="

      # ============================================================
      # 17. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export CC="${{ github.workspace }}/clang/bin/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="${{ github.workspace }}/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-"

          echo "===== BUILD KERNEL ====="

          echo "ARCH=$ARCH"
          echo "CC=$CC"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"

          make \
            -j"$(nproc)" \
            ARCH=arm64 \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out

          echo "===== CHECK OUTPUT ====="

          ls -lh out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "===== KERNEL BUILD SUCCESSFUL ====="

      # ============================================================
      # 18. UPLOAD KERNEL
      # ============================================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-kernel
          path: kernel/out/arch/arm64/boot/Image.gz-dtb