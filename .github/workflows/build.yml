name: Build RMX1821 KernelSU v0.9.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gawk \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            python3-pip \
            unzip \
            wget \
            xz-utils

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch Q \
            "https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git" \
            kernel

          cd kernel
          git rev-parse HEAD

      - name: Download toolchains
        run: |
          git clone --depth=1 \
            "https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git" \
            clang

          git clone --depth=1 \
            "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" \
            gcc64

          git clone --depth=1 \
            "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git" \
            gcc32

          test -x clang/bin/clang
          test -x gcc64/bin/aarch64-linux-android-gcc
          test -x gcc32/bin/arm-linux-androideabi-gcc

          echo "GCC 64-bit:"
          gcc64/bin/aarch64-linux-android-gcc --version | head -n 1

          echo "GCC 32-bit:"
          gcc32/bin/arm-linux-androideabi-gcc --version | head -n 1

      - name: Verify toolchain layout
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          test -x "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc"
          test -x "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc"

          echo "Toolchain layout OK."

- name: Prepare DrvGen Python 2 wrapper
        working-directory: kernel
        run: |
          set -e

          if [ -f tools/dct/DrvGen.py ] && [ ! -f tools/dct/DrvGen.py.real ]; then
            mv tools/dct/DrvGen.py tools/dct/DrvGen.py.real
          fi

          cat > tools/dct/DrvGen.py <<'EOF'
          #!/bin/sh

          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          KERNEL_DIR="$(CDPATH= cd -- "$SCRIPT_DIR/../.." && pwd)"

          DWS="$1"
          GEN="$2"
          LOG="$3"
          PARAM="$4"

          case "$DWS" in
            /*)
              ;;
            *)
              DWS="$(CDPATH= cd -- "$(dirname "$DWS")" && pwd)/$(basename "$DWS")"
              ;;
          esac

          case "$GEN" in
            /*)
              ;;
            *)
              GEN="$(CDPATH= cd -- "$(dirname "$GEN")" && pwd)/$(basename "$GEN")"
              ;;
          esac

          case "$LOG" in
            /*)
              ;;
            *)
              LOG="$(CDPATH= cd -- "$(dirname "$LOG")" && pwd)/$(basename "$LOG")"
              ;;
          esac

          case "$DWS" in
            "$KERNEL_DIR"/*)
              DWS="/workspace/${DWS#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$GEN" in
            "$KERNEL_DIR"/*)
              GEN="/workspace/${GEN#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$LOG" in
            "$KERNEL_DIR"/*)
              LOG="/workspace/${LOG#"$KERNEL_DIR"/}"
              ;;
          esac

          exec docker run --rm \
            -v "$KERNEL_DIR:/workspace" \
            -w /workspace/tools/dct \
            python:2.7 \
            python2 DrvGen.py.real \
            "$DWS" \
            "$GEN" \
            "$LOG" \
            "$PARAM"
          EOF

          chmod +x tools/dct/DrvGen.py

          echo "===== DRVGEN WRAPPER ====="
          cat tools/dct/DrvGen.py

          echo "DrvGen wrapper prepared."

- name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CC: ${{ github.workspace }}/clang/bin/clang
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          set -e

          echo "===== CLANG ====="
          "$CC" --version | head -n 3

          echo "===== TEST CLANG CPU TARGET ====="

          "$CC" \
            --target=aarch64-linux-android \
            -mcpu=cortex-a73.cortex-a53 \
            -E -x c /dev/null \
            -o /dev/null

          echo "Clang CPU target: OK"

          echo "===== VERIFY KERNELSU ====="

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU files: OK"

          echo "===== DEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            CC="$CC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            oppo6771_defconfig

          echo "===== MODIFY CONFIG ====="

          scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR

          scripts/config --file out/.config \
            -e CONFIG_KPROBES \
            -e CONFIG_KSU

          scripts/config --file out/.config \
            --set-val LITTLE_CPU_MASK 15 \
            --set-val BIG_CPU_MASK 240

          echo "===== CONFIG BEFORE OLDDEFCONFIG ====="

          grep -E \
            'CONFIG_(CC_STACKPROTECTOR|LITTLE_CPU_MASK|BIG_CPU_MASK|KSU|KPROBES|KPROBE_EVENTS)=' \
            out/.config || true

          echo "===== OLDDEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            CC="$CC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          echo "===== FINAL CONFIG ====="

          grep -E \
            'CONFIG_(CC_STACKPROTECTOR|LITTLE_CPU_MASK|BIG_CPU_MASK|KSU|KPROBES|KPROBE_EVENTS)=' \
            out/.config || true

          echo "===== REQUIRED KSU CONFIG ====="

          grep -E '^CONFIG_(KSU|KPROBES)=' out/.config

          echo "Kernel configuration completed successfully."

      - name: Test DrvGen
        working-directory: kernel
        run: |
          set -e

          echo "===== TEST DRVGEN ====="

          mkdir -p arch/arm64/boot/dts/oppo6771_18601

          ./tools/dct/DrvGen.py \
            "$(pwd)/drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws" \
            "$(pwd)/arch/arm64/boot/dts/oppo6771_18601" \
            "$(pwd)/arch/arm64/boot/dts/oppo6771_18601" \
            cust_dtsi

          echo "DrvGen completed successfully."

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CC: ${{ github.workspace }}/clang/bin/clang
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          set -e

          echo "===== BUILD KERNEL ====="

          "$CC" --version | head -n 3

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC="$CC" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            Image.gz-dtb

          echo "===== BUILD RESULT ====="

          test -f out/arch/arm64/boot/Image.gz-dtb

          ls -lh out/arch/arm64/boot/Image.gz-dtb

          file out/arch/arm64/boot/Image.gz-dtb

          echo "===== KERNEL BUILD SUCCESS ====="

      - name: Download original boot image
        run: |
          wget -O boot-original.img \
            "https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img"

          test "$(stat -c%s boot-original.img)" -eq 33554432

          echo "Original boot SHA256:"
          sha256sum boot-original.img

      - name: Build MagiskBoot
        run: |
          git clone --depth=1 --recurse-submodules \
            "https://github.com/topjohnwu/Magisk.git" \
            magisk-source

          cd magisk-source

          git submodule update --init --recursive

          python3 build.py ndk
          python3 build.py native magiskboot

          echo "Available magiskboot binaries:"
          find . -type f -name magiskboot -exec file {} \;

      - name: Prepare MagiskBoot
        run: |
          MAGISKBOOT="$(find magisk-source -type f -name magiskboot -executable | head -n 1)"

          test -n "$MAGISKBOOT"

          cp "$MAGISKBOOT" magiskboot
          chmod +x magiskboot

          file magiskboot

      - name: Unpack original boot
        run: |
          rm -rf unpack
          mkdir -p unpack

          ./magiskboot unpack boot-original.img

          mv kernel unpack/kernel

          if [ -f kernel_dtb ]; then
            mv kernel_dtb unpack/kernel_dtb
          fi

          echo "Original boot components:"
          ls -lh unpack/

      - name: Replace kernel and preserve original DTB
        working-directory: kernel
        run: |
          IMG="out/arch/arm64/boot/Image.gz-dtb"

          test -f "$IMG"
          test -f ../unpack/kernel_dtb

          DTB_SIZE="$(stat -c%s ../unpack/kernel_dtb)"
          IMG_SIZE="$(stat -c%s "$IMG")"

          KERNEL_GZ_SIZE=$((IMG_SIZE - DTB_SIZE))

          echo "Image.gz-dtb size: $IMG_SIZE"
          echo "Original DTB size: $DTB_SIZE"
          echo "Kernel gzip size: $KERNEL_GZ_SIZE"

          test "$KERNEL_GZ_SIZE" -gt 0

          dd \
            if="$IMG" \
            of=../new-kernel.gz \
            bs=1 \
            count="$KERNEL_GZ_SIZE" \
            status=none

          gzip -t ../new-kernel.gz

          gzip -dc ../new-kernel.gz > ../unpack/kernel

          test -s ../unpack/kernel
          test -s ../unpack/kernel_dtb

          echo "New kernel:"
          file ../unpack/kernel

          echo "Original DTB:"
          file ../unpack/kernel_dtb

      - name: Repack boot image
        run: |
          ./magiskboot repack boot-original.img new-boot.img

          test -f new-boot.img
          test "$(stat -c%s new-boot.img)" -eq 33554432

          echo "Final boot image:"
          ls -lh new-boot.img

          echo "Final boot SHA256:"
          sha256sum new-boot.img

      - name: Verify final boot image
        run: |
          rm -rf verify-boot
          mkdir verify-boot

          cd verify-boot

          ../magiskboot unpack ../new-boot.img

          echo "Final boot components:"
          ls -lh

          cd ..

          echo "Final boot SHA256:"
          sha256sum new-boot.img

      - name: Upload boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v0.9.5
          path: new-boot.img

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "kernelsu-v0.9.5-${{ github.run_number }}"
          name: "RMX1821 KernelSU v0.9.5 build ${{ github.run_number }}"
          files: new-boot.img