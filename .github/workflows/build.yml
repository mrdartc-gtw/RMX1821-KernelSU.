name: Build RMX1821 KernelSU v0.9.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gawk \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            python3-pip \
            unzip \
            wget \
            xz-utils

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch Q \
            "https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git" \
            kernel

          cd kernel
          git rev-parse HEAD

      - name: Download toolchains
        run: |
          git clone --depth=1 \
            "https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git" \
            clang

          git clone --depth=1 \
            "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" \
            gcc64

          git clone --depth=1 \
            "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git" \
            gcc32

          test -x clang/bin/clang
          test -x gcc64/bin/aarch64-linux-android-gcc
          test -x gcc32/bin/arm-linux-androideabi-gcc

          echo "GCC 64-bit:"
          gcc64/bin/aarch64-linux-android-gcc --version | head -n 1

          echo "GCC 32-bit:"
          gcc32/bin/arm-linux-androideabi-gcc --version | head -n 1

      - name: Verify toolchain layout
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          echo "Repository root:"
          ls -lah "$GITHUB_WORKSPACE"

          echo "gcc64:"
          find "$GITHUB_WORKSPACE/gcc64" -maxdepth 2 -type f \
            -name '*gcc' -o -name 'gcc' | head -20

          echo "gcc32:"
          find "$GITHUB_WORKSPACE/gcc32" -maxdepth 2 -type f \
            -name '*gcc' -o -name 'gcc' | head -20

          test -x "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc"
          test -x "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc"

          echo "Toolchain layout OK."

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash -s -- v0.9.5

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

      - name: Prepare DrvGen Python 2 wrapper
        working-directory: kernel
        run: |
          if [ -f tools/dct/DrvGen.py ] && [ ! -f tools/dct/DrvGen.py.real ]; then
            mv tools/dct/DrvGen.py tools/dct/DrvGen.py.real
          fi

          printf '%s\n' \
            '#!/bin/sh' \
            'SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"' \
            'KERNEL_DIR="$(CDPATH= cd -- "$SCRIPT_DIR/../.." && pwd)"' \
            'exec docker run --rm -v "$KERNEL_DIR:/workspace" -w /workspace/kernel/out python:2.7 python ../tools/dct/DrvGen.py.real "$@"' \
            > tools/dct/DrvGen.py

          chmod +x tools/dct/DrvGen.py

          test -f tools/dct/DrvGen.py.real
          test -x tools/dct/DrvGen.py

          echo "DrvGen wrapper:"
          cat tools/dct/DrvGen.py

      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          echo "Checking GCC:"
          "$CROSS_COMPILE"gcc --version | head -n 1

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            oppo6771_defconfig

          echo "Disabling unsupported stack protector..."

          scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR

          scripts/config --file out/.config \
            -e CONFIG_KPROBES \
            -e CONFIG_KSU

          scripts/config --file out/.config \
            --set-val LITTLE_CPU_MASK 15 \
            --set-val BIG_CPU_MASK 240

          echo "Configuration before olddefconfig:"
          grep -E 'CONFIG_(CC_STACKPROTECTOR|LITTLE_CPU_MASK|BIG_CPU_MASK|KSU|KPROBES|KPROBE_EVENTS)=' out/.config || true

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            olddefconfig

          echo "Final configuration:"
          grep -E 'CONFIG_(CC_STACKPROTECTOR|LITTLE_CPU_MASK|BIG_CPU_MASK|KSU|KPROBES|KPROBE_EVENTS)=' out/.config || true

          echo "Required KernelSU configuration:"
          grep -E '^CONFIG_(KSU|KPROBES)=' out/.config

          echo "Kernel configuration completed successfully."

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          echo "Checking GCC:"
          "$CROSS_COMPILE"gcc --version | head -n 1

          echo "GCC 64-bit:"
          ls -lh "$GITHUB_WORKSPACE/gcc64/bin/aarch64-linux-android-gcc"

          echo "GCC 32-bit:"
          ls -lh "$GITHUB_WORKSPACE/gcc32/bin/arm-linux-androideabi-gcc"

          echo "Testing CPU target:"
          "$CROSS_COMPILE"gcc -mcpu=cortex-a73 -E -x c /dev/null -o /dev/null

          echo "Building kernel..."

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            KCFLAGS="-mcpu=cortex-a73" \
            Image.gz-dtb

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "Kernel build successful:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

          file out/arch/arm64/boot/Image.gz-dtb
      - name: Download original boot image
        run: |
          wget -O boot-original.img \
            "https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img"

          test "$(stat -c%s boot-original.img)" -eq 33554432

          echo "Original boot SHA256:"
          sha256sum boot-original.img

      - name: Build MagiskBoot
        run: |
          git clone --depth=1 --recurse-submodules \
            "https://github.com/topjohnwu/Magisk.git" \
            magisk-source

          cd magisk-source

          git submodule update --init --recursive

          python3 build.py ndk
          python3 build.py native magiskboot

          echo "Available magiskboot binaries:"
          find . -type f -name magiskboot -exec file {} \;

      - name: Prepare MagiskBoot
        run: |
          MAGISKBOOT="$(find magisk-source -type f -name magiskboot -executable | head -n 1)"

          test -n "$MAGISKBOOT"

          cp "$MAGISKBOOT" magiskboot
          chmod +x magiskboot

          file magiskboot

      - name: Unpack original boot
        run: |
          rm -rf unpack
          mkdir -p unpack

          ./magiskboot unpack boot-original.img

          mv kernel unpack/kernel

          if [ -f kernel_dtb ]; then
            mv kernel_dtb unpack/kernel_dtb
          fi

          echo "Original boot components:"
          ls -lh unpack/

      - name: Replace kernel and preserve original DTB
        working-directory: kernel
        run: |
          IMG="out/arch/arm64/boot/Image.gz-dtb"

          test -f "$IMG"
          test -f ../unpack/kernel_dtb

          DTB_SIZE="$(stat -c%s ../unpack/kernel_dtb)"
          IMG_SIZE="$(stat -c%s "$IMG")"

          KERNEL_GZ_SIZE=$((IMG_SIZE - DTB_SIZE))

          echo "Image.gz-dtb size: $IMG_SIZE"
          echo "Original DTB size: $DTB_SIZE"
          echo "Kernel gzip size: $KERNEL_GZ_SIZE"

          test "$KERNEL_GZ_SIZE" -gt 0

          dd \
            if="$IMG" \
            of=../new-kernel.gz \
            bs=1 \
            count="$KERNEL_GZ_SIZE" \
            status=none

          echo "Testing kernel gzip:"
          gzip -t ../new-kernel.gz

          echo "Extracting kernel:"
          gzip -dc ../new-kernel.gz > ../unpack/kernel

          test -s ../unpack/kernel
          test -s ../unpack/kernel_dtb

          echo "New kernel:"
          file ../unpack/kernel

          echo "Original DTB:"
          file ../unpack/kernel_dtb

      - name: Repack boot image
        run: |
          ./magiskboot repack boot-original.img new-boot.img

          test -f new-boot.img
          test "$(stat -c%s new-boot.img)" -eq 33554432

          echo "Final boot image:"
          ls -lh new-boot.img

          echo "Final boot SHA256:"
          sha256sum new-boot.img

      - name: Verify final boot image
        run: |
          echo "Checking final boot image..."

          ./magiskboot unpack new-boot.img

          echo "Final boot components:"
          ls -lh kernel kernel_dtb ramdisk.cpio 2>/dev/null || true

          echo "Final boot SHA256:"
          sha256sum new-boot.img

      - name: Upload boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v0.9.5
          path: new-boot.img

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "kernelsu-v0.9.5-${{ github.run_number }}"
          name: "RMX1821 KernelSU v0.9.5 build ${{ github.run_number }}"
          files: new-boot.img