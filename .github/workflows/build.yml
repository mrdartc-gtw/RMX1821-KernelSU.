name: Build RMX1821 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python2 \
            python2-minimal \
            zip

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          echo "===== Python ====="
          /usr/bin/python2 --version
          python --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

          test -f kernel/tools/dct/DrvGen.py
          chmod +x kernel/tools/dct/DrvGen.py

          echo "DrvGen.py found:"
          head -n 1 kernel/tools/dct/DrvGen.py

      - name: Download Android toolchains
        working-directory: kernel
        run: |
          mkdir -p toolchain
          cd toolchain

          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git \
            clang

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

      - name: Configure kernel
        working-directory: kernel
        run: |
          export ARCH=arm64

          make RMX1821_defconfig

          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_HAVE_KPROBES
          ./scripts/config --enable CONFIG_KPROBE_EVENTS
          ./scripts/config --enable CONFIG_KSU

          make olddefconfig

          echo "===== KernelSU configuration ====="
          grep -E 'CONFIG_(KSU|KPROBE)' .config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export PATH="$PWD/toolchain/clang/bin:$PATH"

          make -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/toolchain/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$PWD/toolchain/gcc32/bin/arm-linux-androideabi-" \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            Image.gz-dtb

      - name: Check output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/
          file out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU
          path: kernel/out/arch/arm64/boot/Image.gz-dtb