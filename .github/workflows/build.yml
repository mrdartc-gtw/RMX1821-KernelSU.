name: Build RMX1821 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python2 \
            python2-minimal \
            zip

          sudo ln -sf /usr/bin/python2 /usr/local/bin/python

          echo "===== Python ====="
          /usr/bin/python2 --version
          python --version

      - name: Download kernel source
        run: |
          rm -rf kernel kernel.tar.gz

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            -o kernel.tar.gz \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821/archive/refs/heads/Q.tar.gz

          tar -xzf kernel.tar.gz

          mv CosmicFresh-RMX1821-Q kernel

          test -f kernel/tools/dct/DrvGen.py
          chmod +x kernel/tools/dct/DrvGen.py

          echo "===== Kernel source ====="
          du -sh kernel

          echo "===== DrvGen.py ====="
          head -n 1 kernel/tools/dct/DrvGen.py

      - name: Download Android toolchains
        working-directory: kernel
        run: |
          mkdir -p toolchain
          cd toolchain

          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git \
            clang

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s v0.9.5

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -euxo pipefail

          export ARCH=arm64
          export KBUILD_OUTPUT="$PWD/out"

          rm -f .config
          rm -rf include/config

          echo "===== Creating base config ====="
          make RMX1821_defconfig

          echo "===== Checking generated config ====="
          test -f out/.config
          ls -lh out/.config

          echo "===== Enabling KernelSU/KPROBE ====="
          ./scripts/config --file out/.config --enable CONFIG_KPROBES
          ./scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
          ./scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
          ./scripts/config --file out/.config --enable CONFIG_KSU

          echo "===== Running olddefconfig ====="
          KCONFIG_CONFIG="$PWD/out/.config" make olddefconfig

          echo "===== Final config ====="
          ls -lh out/.config

          echo "===== KernelSU/KPROBE status ====="
          grep -E '^CONFIG_(KSU|KPROBES|HAVE_KPROBES|KPROBE_EVENTS)=' out/.config || true

          echo "===== Source tree ====="
          if [ -f .config ]; then
            echo "ERROR: source .config exists"
            exit 1
          fi

          echo "Source .config: OK"
 
      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export KBUILD_OUTPUT="$PWD/out"
          export PATH="$PWD/toolchain/clang/bin:$PATH"

          make -j$(nproc) \
            ARCH=arm64 \
            KBUILD_OUTPUT="$PWD/out" \
            KCONFIG_CONFIG="$PWD/out/.config" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$PWD/toolchain/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$PWD/toolchain/gcc32/bin/arm-linux-androideabi-" \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            Image.gz-dtb

      - name: Check output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/
          file out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU
          path: kernel/out/arch/arm64/boot/Image.gz-dtb