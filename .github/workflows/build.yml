name: Build RMX1821 KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libssl-dev \
            libelf-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # CLONE KERNEL SOURCE
      # ============================================================

      - name: Clone RMX1821 kernel source
        run: |
          git clone --depth=1 \
            --branch Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

# ============================================================
      # INSTALL CLANG r437112b
      # ============================================================

      - name: Install Clang r437112b
        run: |
          set -e

          echo "===== DOWNLOAD CLANG r437112b ====="

          mkdir -p clang

          curl -L --fail --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/98603376816dd5a1fbb960856438124d4c618158/clang-r437112b.tar.gz" \
            -o clang-r437112b.tar.gz

          echo "===== EXTRACT CLANG ====="

          tar -xzf clang-r437112b.tar.gz -C clang

          rm -f clang-r437112b.tar.gz

          echo "===== VERIFY CLANG ====="

          test -x clang-r437112b/bin/clang

          echo "===== CLANG VERSION ====="

          ./clang-r437112b/bin/clang --version

          echo "===== MOVE CLANG ====="

          mv clang-r437112b/* clang/

          rmdir clang-r437112b

          echo "===== FINAL VERIFY ====="

          test -x clang/bin/clang

          ./clang/bin/clang --version

          echo "===== CLANG READY ====="

      # ============================================================
      # GCC 4.9 AARCH64
      # ============================================================

      - name: Install GCC 4.9 AArch64
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc64

          echo "===== GCC64 ====="
          gcc64/bin/aarch64-linux-android-gcc --version

      # ============================================================
      # GCC 4.9 ARM32
      # ============================================================

      - name: Install GCC 4.9 ARM32
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            gcc32

          echo "===== GCC32 ====="
          gcc32/bin/arm-linux-androideabi-gcc --version

      # ============================================================
      # VERIFY TOOLCHAIN
      # ============================================================

      - name: Verify toolchain
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64

          export CC="${GITHUB_WORKSPACE}/clang/bin/clang"

          export CLANG_TRIPLE="aarch64-linux-gnu-"

          export CROSS_COMPILE="${GITHUB_WORKSPACE}/gcc64/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="${GITHUB_WORKSPACE}/gcc32/bin/arm-linux-androideabi-"

          echo "ARCH=$ARCH"
          echo "CC=$CC"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"

          "$CC" --version

          "${CROSS_COMPILE}gcc" --version

          "${CROSS_COMPILE_ARM32}gcc" --version

      # ============================================================
      # KERNELSU v0.9.5
      # ============================================================

      - name: Integrate KernelSU v0.9.5
        working-directory: kernel
        run: |
          set -e

          echo "===== INSTALL KERNELSU v0.9.5 ====="

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash -s -- v0.9.5

          echo "===== VERIFY KERNELSU ====="

          test -e drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU directory:"
          ls -la drivers/kernelsu

          echo "KernelSU integration: OK"

      # ============================================================
      # PATCH CPU TARGET
      # ============================================================

      - name: Patch unsupported CPU flags
        working-directory: kernel
        run: |
          set -e

          echo "===== BEFORE ====="
          grep -n "cortex-a73" Makefile || true

          sed -i \
            's/-mcpu=cortex-a73\.cortex-a53/-mcpu=cortex-a53/g' \
            Makefile

          sed -i \
            's/-mtune=cortex-a73\.cortex-a53/-mtune=cortex-a53/g' \
            Makefile

          echo "===== AFTER ====="
          grep -n "mcpu\|mtune" Makefile | head -20

      # ============================================================
      # PREPARE DRVGEN
      # ============================================================

      - name: Prepare DrvGen Python 2 wrapper
        working-directory: kernel
        run: |
          set -e

          cd tools/dct

          if [ ! -f DrvGen.py.real ]; then
            cp DrvGen.py DrvGen.py.real
          fi

          cat > DrvGen.py <<'EOF'
          #!/bin/sh
          set -e

          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          KERNEL_DIR="$(CDPATH= cd -- "$SCRIPT_DIR/../.." && pwd)"

          DWS="$1"
          GEN="$2"
          LOG="$3"
          PARAM="$4"

          if [ -z "$DWS" ] || [ -z "$GEN" ] || [ -z "$LOG" ]; then
            echo "DrvGen wrapper: missing arguments"
            exit 1
          fi

          resolve_path() {
            TARGET="$1"

            case "$TARGET" in
              /*)
                printf '%s\n' "$TARGET"
                ;;
              *)
                printf '%s/%s\n' "$(pwd)" "$TARGET"
                ;;
            esac
          }

          DWS="$(resolve_path "$DWS")"
          GEN="$(resolve_path "$GEN")"
          LOG="$(resolve_path "$LOG")"

          case "$DWS" in
            "$KERNEL_DIR"/*)
              DWS="/workspace/${DWS#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$GEN" in
            "$KERNEL_DIR"/*)
              GEN="/workspace/${GEN#"$KERNEL_DIR"/}"
              ;;
          esac

          case "$LOG" in
            "$KERNEL_DIR"/*)
              LOG="/workspace/${LOG#"$KERNEL_DIR"/}"
              ;;
          esac

          echo "[DrvGen wrapper] DWS=$DWS"
          echo "[DrvGen wrapper] GEN=$GEN"
          echo "[DrvGen wrapper] LOG=$LOG"

          exec docker run --rm \
            -v "$KERNEL_DIR:/workspace" \
            -w /workspace/tools/dct \
            python:2.7 \
            python2 DrvGen.py.real \
            "$DWS" \
            "$GEN" \
            "$LOG" \
            "$PARAM"
          EOF

          chmod +x DrvGen.py

          echo "DrvGen wrapper ready."

      # ============================================================
      # VERIFY KERNELSU
      # ============================================================

      - name: Verify KernelSU files
        working-directory: kernel
        run: |
          set -e

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== KERNELSU ====="

          if [ -e drivers/kernelsu ]; then
            echo "drivers/kernelsu EXISTS"
            ls -la drivers/kernelsu
          else
            echo "ERROR: drivers/kernelsu DOES NOT EXIST"
            exit 1
          fi

          echo "===== KCONFIG ====="
          test -f drivers/kernelsu/Kconfig

          echo "===== MAKEFILE ====="
          test -f drivers/kernelsu/Makefile

          echo "===== KERNELSU VERIFY OK ====="

      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================

      - name: Configure kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CC: ${{ github.workspace }}/clang/bin/clang
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          set -e

          echo "===== TOOLCHAIN ====="
          "$CC" --version
          "${CROSS_COMPILE}gcc" --version

          echo "===== CLANG TRIPLE ====="
          echo "$CLANG_TRIPLE"

          echo "===== DEFCONFIG ====="

          make \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            oppo6771_defconfig

          echo "===== DISABLE STACK PROTECTOR ====="

          scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR_REGULAR

          echo "===== ENABLE KPROBES ====="

          scripts/config --file out/.config \
            -e CONFIG_KPROBES \
            -e CONFIG_KSU

          echo "===== CPU MASK ====="

          scripts/config --file out/.config \
            --set-val LITTLE_CPU_MASK 15 \
            --set-val BIG_CPU_MASK 240

          echo "===== OLDDEFCONFIG ====="

          make \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out \
            olddefconfig

          echo "===== KERNELSU CONFIG ====="
          grep -E '^CONFIG_(KSU|KPROBES)=' out/.config || true

          echo "===== CPU MASK CONFIG ====="
          grep -E 'CONFIG_(LITTLE_CPU_MASK|BIG_CPU_MASK)' out/.config || true

      # ============================================================
      # TEST DRVGEN
      # ============================================================

      - name: Test DrvGen
        working-directory: kernel
        run: |
          set -e

          mkdir -p \
            arch/arm64/boot/dts/oppo6771_18601

          ./tools/dct/DrvGen.py \
            "$(pwd)/drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws" \
            "$(pwd)/arch/arm64/boot/dts/oppo6771_18601" \
            "$(pwd)/arch/arm64/boot/dts/oppo6771_18601" \
            cust_dtsi

          echo "DrvGen completed successfully."

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          CC: ${{ github.workspace }}/clang/bin/clang
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: ${{ github.workspace }}/gcc64/bin/aarch64-linux-android-
          CROSS_COMPILE_ARM32: ${{ github.workspace }}/gcc32/bin/arm-linux-androideabi-
        run: |
          set -e

          echo "===== BUILD ====="

          make \
            -j"$(nproc)" \
            ARCH="$ARCH" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            O=out

          echo "===== CHECK OUTPUT ====="

          ls -lh out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "Kernel build successful."

      # ============================================================
      # DOWNLOAD ORIGINAL BOOT
      # ============================================================

      - name: Download original boot image
        run: |
          set -e

          mkdir -p bootwork

          curl -L \
            -o bootwork/boot-original.img \
            "https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img"

          ls -lh bootwork/boot-original.img

          test "$(stat -c%s bootwork/boot-original.img)" -eq 33554432

      # ============================================================
      # BUILD MAGISKBOOT
      # ============================================================

      - name: Build MagiskBoot
        run: |
          set -e

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/topjohnwu/Magisk.git \
            magisk-source

          cd magisk-source

          git submodule update --init --recursive

          python3 build.py ndk

          python3 build.py native magiskboot

          echo "===== SEARCH MAGISKBOOT ====="

          find . \
            -type f \
            -name magiskboot \
            -perm -111 \
            -print

          MAGISKBOOT="$(find . \
            -type f \
            -name magiskboot \
            -perm -111 \
            | head -n 1)"

          if [ -z "$MAGISKBOOT" ]; then
            echo "ERROR: magiskboot not found"
            exit 1
          fi

          cp "$MAGISKBOOT" ../magiskboot

          chmod +x ../magiskboot

          file ../magiskboot

          ../magiskboot --help || true

      # ============================================================
      # UNPACK ORIGINAL BOOT
      # ============================================================

      - name: Unpack original boot
        run: |
          set -e

          rm -rf unpack
          mkdir -p unpack

          cd unpack

          ../magiskboot unpack ../bootwork/boot-original.img

          echo "===== UNPACKED FILES ====="
          ls -lah

          echo "===== HEADER ====="
          cat header || true

      # ============================================================
      # REPLACE KERNEL
      # ============================================================

      - name: Replace kernel with KernelSU kernel
        working-directory: kernel
        run: |
          set -e

          IMG="out/arch/arm64/boot/Image.gz-dtb"

          test -f "$IMG"

          DTB_SIZE="$(stat -c%s ../unpack/kernel_dtb)"
          IMG_SIZE="$(stat -c%s "$IMG")"

          echo "Image.gz-dtb size: $IMG_SIZE"
          echo "Original DTB size: $DTB_SIZE"

          KERNEL_GZ_SIZE=$((IMG_SIZE - DTB_SIZE))

          echo "Kernel gzip size: $KERNEL_GZ_SIZE"

          dd \
            if="$IMG" \
            of="../new-kernel.gz" \
            bs=1 \
            count="$KERNEL_GZ_SIZE" \
            status=none

          gzip -t ../new-kernel.gz

          echo "Kernel gzip test: OK"

          gzip -dc ../new-kernel.gz > ../unpack/kernel

          echo "New kernel:"
          ls -lh ../unpack/kernel

          echo "Original DTB preserved:"
          ls -lh ../unpack/kernel_dtb

      # ============================================================
      # REPACK BOOT
      # ============================================================

      - name: Repack boot image
        working-directory: unpack
        run: |
          set -e

          ../magiskboot repack \
            ../bootwork/boot-original.img \
            ../new-boot.img

          echo "===== NEW BOOT ====="

          ls -lh ../new-boot.img

          SIZE="$(stat -c%s ../new-boot.img)"

          echo "Size: $SIZE"

          if [ "$SIZE" -ne 33554432 ]; then
            echo "WARNING: boot image size differs from original."
          fi

      # ============================================================
      # VERIFY FINAL BOOT
      # ============================================================

      - name: Verify final boot image
        run: |
          set -e

          rm -rf verify-boot
          mkdir -p verify-boot

          cd verify-boot

          ../magiskboot unpack ../new-boot.img

          echo "===== FINAL BOOT HEADER ====="
          cat header || true

          echo "===== FINAL FILES ====="
          ls -lah

          test -f kernel
          test -f kernel_dtb

          echo "Final boot verification successful."

      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate SHA256
        run: |
          sha256sum new-boot.img | tee new-boot.img.sha256

          echo "===== SHA256 ====="
          cat new-boot.img.sha256

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU
          path: |
            new-boot.img
            new-boot.img.sha256

      # ============================================================
      # RELEASE
      # ============================================================

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernelsu-${{ github.run_number }}
          name: RMX1821 KernelSU Build ${{ github.run_number }}
          files: |
            new-boot.img
            new-boot.img.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}