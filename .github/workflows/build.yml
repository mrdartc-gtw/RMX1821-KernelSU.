name: Build RMX1821 KernelSU v0.9.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            make \
            unzip \
            wget \
            xz-utils \
            zip \
            device-tree-compiler \
            file \
            gzip \
            python3 \
            python3-pip \
            perl \
            rsync

          python3 --version
          gcc --version
          make --version


      # ============================================================
      # 2. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4


      # ============================================================
      # 3. CLONE KERNEL SOURCE
      # ============================================================
      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b Q \
            https://github.com/Dark-Matter7232/CosmicFresh-RMX1821.git \
            kernel

          cd kernel

          echo "===== KERNEL SOURCE ====="
          git remote -v
          git log -1 --oneline


      # ============================================================
      # 4. CLONE TOOLCHAINS
      # ============================================================
      - name: Clone toolchains
        run: |
          mkdir -p toolchains

          git clone --depth=1 \
            https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r437112.git \
            toolchains/clang

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchains/gcc64

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchains/gcc32

          echo "===== TOOLCHAINS ====="

          ls -lah toolchains

          test -x toolchains/clang/bin/clang
          test -x toolchains/gcc64/bin/aarch64-linux-android-gcc
          test -x toolchains/gcc32/bin/arm-linux-androideabi-gcc


      # ============================================================
      # 5. INSTALL KERNELSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU v0.9.5
        run: |
          cd kernel

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh \
            | bash -s -- v0.9.5

          echo "===== KERNELSU ====="

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          echo "KernelSU integration OK"

          if [ -d KernelSU/.git ]; then
            git -C KernelSU describe --tags --exact-match
          fi


      # ============================================================
      # 6. PREPARE DRVGEN
      # ============================================================
      - name: Prepare DrvGen
        run: |
          set -eux

          cd kernel

          test -f tools/dct/DrvGen.py
          test -f scripts/drvgen/drvgen.mk

          echo "===== ORIGINAL DRVGEN ====="

          ls -lah tools/dct/DrvGen.py

          file tools/dct/DrvGen.py

          echo "===== SHEBANG ====="

          head -n 10 tools/dct/DrvGen.py || true

          echo "===== DRVGEN LOCATION ====="

          realpath tools/dct/DrvGen.py

          echo "===== PYTHON ====="

          python3 --version
          command -v python3

          echo "===== TEST ORIGINAL DRVGEN WITH PYTHON3 ====="

          python3 tools/dct/DrvGen.py || true

          echo "===== CREATE PYTHON3 LAUNCHER ====="

          mv tools/dct/DrvGen.py tools/dct/DrvGen.py.real

          cat > tools/dct/DrvGen.py <<'EOF'
#!/bin/sh
exec python3 "$(dirname "$0")/DrvGen.py.real" "$@"
EOF

          chmod +x tools/dct/DrvGen.py

          echo "===== NEW DRVGEN ====="

          cat tools/dct/DrvGen.py

          file tools/dct/DrvGen.py

          echo "===== TEST LAUNCHER ====="

          tools/dct/DrvGen.py || true


      # ============================================================
      # 7. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          echo "===== CLANG ====="
          clang --version

          echo "===== GCC64 ====="
          aarch64-linux-android-gcc --version

          echo "===== GCC32 ====="
          arm-linux-androideabi-gcc --version

          echo "===== DEFCONFIG ====="

          make O=out RMX1821_defconfig

          echo "===== ENABLE KERNELSU ====="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KSU

          echo "===== ENABLE KPROBES ====="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBES

          echo "===== ENABLE KPROBE EVENTS ====="

          ./scripts/config \
            --file out/.config \
            --enable CONFIG_KPROBE_EVENTS

          echo "===== OLDDEFCONFIG ====="

          make O=out olddefconfig

          echo "===== CHECK CONFIG ====="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS)=' \
            out/.config

          test "$(grep '^CONFIG_KSU=' out/.config)" = "CONFIG_KSU=y"
          test "$(grep '^CONFIG_KPROBES=' out/.config)" = "CONFIG_KPROBES=y"
          test "$(grep '^CONFIG_KPROBE_EVENTS=' out/.config)" = "CONFIG_KPROBE_EVENTS=y"

          echo "KernelSU configuration OK"


      # ============================================================
      # 8. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        run: |
          set -eux

          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64

          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$GITHUB_WORKSPACE/toolchains/clang/bin/clang"

          echo "===== BUILD ENVIRONMENT ====="

          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "CC=$CC"

          echo "===== BUILD ====="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            Image.gz-dtb

          echo "===== BUILD OUTPUT ====="

          ls -lah out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image.gz
          test -f out/arch/arm64/boot/Image.gz-dtb

          echo "===== IMAGE INFO ====="

          file out/arch/arm64/boot/Image.gz
          file out/arch/arm64/boot/Image.gz-dtb

          sha256sum \
            out/arch/arm64/boot/Image.gz \
            out/arch/arm64/boot/Image.gz-dtb


      # ============================================================
      # 9. DOWNLOAD ORIGINAL BOOT
      # ============================================================
      - name: Download original boot.img
        run: |
          mkdir -p original

          wget -O original/boot.img \
            https://github.com/mrdartc-gtw/RMX1821-KernelSU./releases/download/boot-original/boot.img

          ls -lah original/boot.img

          file original/boot.img

          sha256sum original/boot.img


      # ============================================================
      # 10. BUILD MAGISKBOOT
      # ============================================================
      - name: Build magiskboot
        run: |
          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/topjohnwu/Magisk.git \
            magisk-source

          cd magisk-source

          git submodule update --init --recursive

          test -f native/src/external/cxx-rs/Cargo.toml

          python3 build.py ndk
          python3 build.py native magiskboot

          echo "===== SEARCH MAGISKBOOT ====="

          find . -type f -name magiskboot -exec file {} \;

          mkdir -p "$GITHUB_WORKSPACE/magiskboot-bin"

          find . -type f -name magiskboot \
            -exec sh -c '
              if file "$1" | grep -q "ELF 64-bit.*x86-64"; then
                cp "$1" "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot"
                exit 0
              fi
            ' _ {} \;

          test -f "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot"

          chmod +x "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot"

          file "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot"


      # ============================================================
      # 11. UNPACK ORIGINAL BOOT
      # ============================================================
      - name: Unpack original boot
        run: |
          set -eux

          mkdir -p unpack

          cd unpack

          "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot" \
            unpack "$GITHUB_WORKSPACE/original/boot.img"

          echo "===== UNPACKED FILES ====="

          ls -lah

          echo "===== BOOT INFO ====="

          "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot" \
            unpack "$GITHUB_WORKSPACE/original/boot.img" \
            2>&1 | tee "$GITHUB_WORKSPACE/boot-info.txt"


      # ============================================================
      # 12. PREPARE TEST KERNEL
      # ============================================================
      - name: Prepare test kernel
        run: |
          set -eux

          mkdir -p repack

          echo "===== ORIGINAL BOOT KERNEL ====="

          ls -lah unpack/kernel
          file unpack/kernel

          echo "===== NEW KERNEL ====="

          ls -lah kernel/out/arch/arm64/boot/Image.gz
          file kernel/out/arch/arm64/boot/Image.gz

          echo "===== PRESERVE ORIGINAL DTB ====="

          test -f unpack/kernel_dtb

          cp \
            unpack/kernel_dtb \
            repack/original-kernel_dtb

          echo "===== COPY NEW GZIP KERNEL ====="

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            repack/kernel.gz

          echo "===== VERIFY ====="

          ls -lah repack/

          file repack/kernel.gz
          file repack/original-kernel_dtb


      # ============================================================
      # 13. REPLACE ONLY KERNEL
      # ============================================================
      - name: Replace kernel while preserving DTB
        run: |
          set -eux

          echo "===== CREATE NEW KERNEL ====="

          cp \
            repack/kernel.gz \
            unpack/kernel

          echo "===== RESTORE ORIGINAL DTB ====="

          cp \
            repack/original-kernel_dtb \
            unpack/kernel_dtb

          echo "===== VERIFY UNPACK DIRECTORY ====="

          ls -lah unpack/

          file unpack/kernel
          file unpack/kernel_dtb

          echo "===== KERNEL SHA256 ====="

          sha256sum unpack/kernel


      # ============================================================
      # 14. REPACK BOOT
      # ============================================================
      - name: Repack boot.img
        run: |
          set -eux

          cd unpack

          "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot" \
            repack \
            "$GITHUB_WORKSPACE/original/boot.img"

          echo "===== REPACK RESULT ====="

          ls -lah

          find . -maxdepth 1 -type f -name 'new-boot.img' -exec file {} \;

          test -f new-boot.img

          cp \
            new-boot.img \
            "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

          echo "===== FINAL BOOT ====="

          ls -lah "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

          file "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

          sha256sum \
            "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"


      # ============================================================
      # 15. VERIFY FINAL BOOT
      # ============================================================
      - name: Verify final boot.img
        run: |
          set -eux

          mkdir -p verify

          cd verify

          "$GITHUB_WORKSPACE/magiskboot-bin/magiskboot" \
            unpack \
            "$GITHUB_WORKSPACE/RMX1821-KernelSU-v0.9.5-test.img"

          echo "===== FINAL BOOT CONTENT ====="

          ls -lah

          echo "===== FINAL KERNEL ====="

          file kernel
          ls -lah kernel

          echo "===== FINAL DTB ====="

          file kernel_dtb
          ls -lah kernel_dtb

          echo "===== FINAL RAMDISK ====="

          ls -lah ramdisk.cpio* || true

          echo "===== SEARCH KERNELSU ====="

          strings kernel | grep -i \
            -E 'kernelsu|ksud|/data/adb/ksud' \
            | head -30 \
            || true


      # ============================================================
      # 16. COPY CONFIG
      # ============================================================
      - name: Prepare artifacts
        run: |
          cp \
            kernel/out/.config \
            kernel.config

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            Image.gz

          cp \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            Image.gz-dtb

          echo "===== ARTIFACTS ====="

          ls -lah \
            RMX1821-KernelSU-v0.9.5-test.img \
            Image.gz \
            Image.gz-dtb \
            kernel.config


      # ============================================================
      # 17. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RMX1821-KernelSU-v0.9.5
          path: |
            RMX1821-KernelSU-v0.9.5-test.img
            Image.gz
            Image.gz-dtb
            kernel.config
            boot-info.txt


      # ============================================================
      # 18. CREATE GITHUB RELEASE
      # ============================================================
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernelsu-v0.9.5-${{ github.run_number }}
          name: RMX1821 KernelSU v0.9.5 Build ${{ github.run_number }}
          files: |
            RMX1821-KernelSU-v0.9.5-test.img
            Image.gz
            Image.gz-dtb
            kernel.config
          generate_release_notes: true