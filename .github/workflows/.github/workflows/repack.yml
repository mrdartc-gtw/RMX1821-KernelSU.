name: Repack RMX1821 KernelSU Boot

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            jq

      - name: Download original boot.img
        run: |
          mkdir -p original

          curl -L \
            --fail \
            -o original/boot.img \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/boot-original/boot.img"

          ls -lh original/boot.img
          file original/boot.img

      - name: Download KernelSU artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kernel-artifact

          RUN_ID=$(gh run list \
            --workflow "Build RMX1821 KernelSU" \
            --repo "${GITHUB_REPOSITORY}" \
            --status completed \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId' \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "Build KernelSU berhasil tidak ditemukan."
            exit 1
          fi

          echo "KernelSU workflow run: $RUN_ID"

          gh run download "$RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name RMX1821-KernelSU \
            --dir kernel-artifact

          find kernel-artifact -type f -ls

      - name: Prepare Image.gz-dtb
        run: |
          IMAGE=$(find kernel-artifact -name "Image.gz-dtb" | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "Image.gz-dtb tidak ditemukan."
            exit 1
          fi

          cp "$IMAGE" Image.gz-dtb

          ls -lh Image.gz-dtb
          file Image.gz-dtb

      - name: Download latest Magisk
        run: |
          mkdir -p magisk

          curl -L \
            --fail \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            -o magisk-release.json

          APK_URL=$(jq -r '
            .assets[]
            | select(.name | endswith(".apk"))
            | .browser_download_url
          ' magisk-release.json | head -n 1)

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "Magisk APK tidak ditemukan."
            exit 1
          fi

          curl -L \
            --fail \
            "$APK_URL" \
            -o magisk.apk

          unzip -j magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d magisk

          mv magisk/libmagiskboot.so magisk/magiskboot
          chmod +x magisk/magiskboot