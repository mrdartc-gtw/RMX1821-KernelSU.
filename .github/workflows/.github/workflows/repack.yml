name: Repack RMX1821 KernelSU Boot

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip jq

      - name: Check boot.img
        run: |
          test -f boot.img
          ls -lh boot.img
          file boot.img

      - name: Download latest KernelSU artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kernel-artifact

          gh run list \
            --workflow "Build RMX1821 KernelSU" \
            --repo "${GITHUB_REPOSITORY}" \
            --status completed \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId' \
            | head -n 1 > run_id.txt

          RUN_ID=$(cat run_id.txt)

          if [ -z "$RUN_ID" ]; then
            echo "KernelSU build artifact tidak ditemukan."
            exit 1
          fi

          echo "Menggunakan workflow run: $RUN_ID"

          gh run download "$RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name RMX1821-KernelSU \
            --dir kernel-artifact

          find kernel-artifact -type f -ls

      - name: Extract Image.gz-dtb
        run: |
          IMAGE=$(find kernel-artifact -name 'Image.gz-dtb' | head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "Image.gz-dtb tidak ditemukan."
            exit 1
          fi

          cp "$IMAGE" Image.gz-dtb

          ls -lh Image.gz-dtb
          file Image.gz-dtb

      - name: Download Magisk
        run: |
          mkdir -p magisk

          curl -L \
            --fail \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            -o magisk-release.json

          APK_URL=$(jq -r '
            .assets[]
            | select(.name | endswith(".apk"))
            | .browser_download_url
          ' magisk-release.json | head -n 1)

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null